<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">سجل متابعة الطلاب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow-up">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e3a5f;
    --navy-dark:#152a45;
    --bg:#eef1f6;
    --surface:#ffffff;
    --line:#e1e6ed;
    --ink:#1c2733;
    --muted:#7c8a9a;
    --accent:#2f6f5e;
    --excellent:#2e8b62;
    --excellent-bg:#e4f5ec;
    --good:#2f6f9f;
    --good-bg:#e6f0f9;
    --average:#c9891f;
    --average-bg:#fbf0dc;
    --weak:#c1483f;
    --weak-bg:#faeae8;
    --radius-card:16px;
    --radius-chip:10px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Tajawal', 'Inter', sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  html[dir="ltr"] body{ font-family:'Inter', 'Tajawal', sans-serif; }
  button, input, select{ font-family:inherit; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  .appbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 14px calc(12px + 2px);
    box-shadow:0 2px 8px rgba(21,42,69,.25);
  }
  .appbar-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .appbar-title{
    flex:1;
    min-width:0;
  }
  .appbar-title h1{
    margin:0;
    font-size:18px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .appbar-sub{
    margin:2px 0 0;
    font-size:12px;
    color:#c3d0e0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,.28);}
  .lang-pill{
    display:flex;
    border-radius:20px;
    background:rgba(255,255,255,.14);
    overflow:hidden;
    flex-shrink:0;
  }
  .lang-pill button{
    border:none;
    background:transparent;
    color:#dbe6f2;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    cursor:pointer;
  }
  .lang-pill button.active{
    background:#fff;
    color:var(--navy);
    border-radius:20px;
  }

  .subbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px 4px;
  }
  .count-badge{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
  }

  .content{
    flex:1;
    padding:8px 14px calc(96px + var(--safe-bottom));
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
  }
  .empty-state .emoji{font-size:40px; margin-bottom:10px;}
  .empty-state p{margin:0; font-size:14.5px; line-height:1.6;}

  .card{
    background:var(--surface);
    border-radius:var(--radius-card);
    box-shadow:0 1px 2px rgba(21,42,69,.06), 0 1px 8px rgba(21,42,69,.05);
    margin-bottom:12px;
    overflow:hidden;
  }
  .card-head{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 12px 8px;
  }
  .avatar{
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--navy);
    color:#fff;
    font-weight:900;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .card-head input.name-input{
    flex:1;
    min-width:0;
    border:none;
    background:transparent;
    font-size:16px;
    font-weight:700;
    color:var(--ink);
    padding:8px 4px;
    border-bottom:1.5px solid transparent;
  }
  .card-head input.name-input:focus{
    outline:none;
    border-bottom-color:var(--navy);
  }
  .card-menu-btn{
    width:32px;
    height:32px;
    border-radius:50%;
    border:none;
    background:transparent;
    color:var(--muted);
    font-size:18px;
    cursor:pointer;
    flex-shrink:0;
  }
  .card-menu-btn:active{background:var(--bg);}

  .rating-grid{
    padding:2px 12px 10px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .rating-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .rating-label{
    width:78px;
    flex-shrink:0;
    font-size:12.5px;
    color:var(--muted);
    font-weight:700;
  }
  .rating-options{
    flex:1;
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:5px;
  }
  .chip{
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--muted);
    font-size:11.5px;
    font-weight:700;
    border-radius:var(--radius-chip);
    padding:7px 2px;
    text-align:center;
    cursor:pointer;
    line-height:1.2;
  }
  .chip.sel-excellent{ background:var(--excellent-bg); border-color:var(--excellent); color:var(--excellent); }
  .chip.sel-good{ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .chip.sel-average{ background:var(--average-bg); border-color:var(--average); color:var(--average); }
  .chip.sel-weak{ background:var(--weak-bg); border-color:var(--weak); color:var(--weak); }

  .notes-wrap{
    padding:0 12px 14px;
  }
  .notes-wrap input{
    width:100%;
    border:none;
    background:var(--bg);
    border-radius:10px;
    padding:10px 12px;
    font-size:13.5px;
    color:var(--ink);
  }
  .notes-wrap input:focus{outline:1.5px solid var(--navy);}

  .fab{
    position:fixed;
    bottom:calc(24px + var(--safe-bottom));
    inset-inline-end:calc(50% - 280px + 20px);
    width:58px;
    height:58px;
    border-radius:50%;
    background:var(--accent);
    color:#fff;
    border:none;
    font-size:26px;
    box-shadow:0 4px 14px rgba(47,111,94,.45);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:15;
  }
  .fab:active{ filter:brightness(0.92); }
  @media (max-width:600px){
    .fab{ inset-inline-end:20px; }
  }

  .toast{
    position:fixed;
    bottom:calc(24px + var(--safe-bottom));
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-dark);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:10px 18px;
    border-radius:30px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    z-index:40;
    pointer-events:none;
    white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .sheet-overlay{
    position:fixed;
    inset:0;
    background:rgba(20,30,45,.45);
    z-index:50;
    display:none;
  }
  .sheet-overlay.open{ display:block; }
  .bottom-sheet{
    position:fixed;
    left:50%;
    bottom:0;
    transform:translateX(-50%) translateY(100%);
    width:100%;
    max-width:560px;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    z-index:51;
    transition:transform .25s ease;
    max-height:88vh;
    overflow-y:auto;
    padding-bottom:calc(20px + var(--safe-bottom));
  }
  .bottom-sheet.open{ transform:translateX(-50%) translateY(0); }
  .sheet-handle{
    width:38px;
    height:4px;
    background:var(--line);
    border-radius:4px;
    margin:10px auto 4px;
  }
  .sheet-title{
    font-size:16px;
    font-weight:900;
    color:var(--navy);
    padding:10px 20px 4px;
  }
  .sheet-field{
    padding:10px 20px;
  }
  .sheet-field label{
    display:block;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    margin-bottom:6px;
  }
  .sheet-field input{
    width:100%;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    font-size:14.5px;
    color:var(--ink);
    background:var(--bg);
  }
  .sheet-field input:focus{ outline:none; border-color:var(--navy); }
  .sheet-divider{ height:1px; background:var(--line); margin:10px 20px; }
  .sheet-action{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    border:none;
    background:none;
    padding:14px 20px;
    font-size:14.5px;
    font-weight:700;
    color:var(--ink);
    text-align:start;
    cursor:pointer;
  }
  .sheet-action:active{ background:var(--bg); }
  .sheet-action.danger{ color:var(--weak); }
  .sheet-action .sa-icon{
    width:22px;
    text-align:center;
    font-size:16px;
    flex-shrink:0;
  }

  @media (max-width:380px){
    .rating-label{ width:64px; font-size:11.5px; }
    .chip{ font-size:10.5px; padding:6px 2px; }
  }

  @media print{
    .appbar, .fab, .toast, .sheet-overlay, .bottom-sheet, .card-menu-btn{ display:none !important; }
    body{ background:#fff; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="appbar">
    <div class="appbar-row">
      <div class="appbar-title">
        <h1 id="titleText">سجل متابعة الطلاب</h1>
        <p class="appbar-sub" id="appbarSub">—</p>
      </div>
      <div class="lang-pill">
        <button id="btnAr" class="active">AR</button>
        <button id="btnEn">EN</button>
      </div>
      <button class="icon-btn" id="menuBtn" title="Menu">⋮</button>
    </div>
  </div>

  <div class="subbar">
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div class="content" id="content">
  </div>

  <button class="fab" id="fabAdd" title="">+</button>
  <div class="toast" id="toast"></div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">إعدادات الكشف</div>

    <div class="sheet-field">
      <label id="lblClass">الفصل</label>
      <input type="text" id="classField">
    </div>
    <div class="sheet-field">
      <label id="lblSubject">المادة</label>
      <input type="text" id="subjectField">
    </div>
    <div class="sheet-field">
      <label id="lblDate">التاريخ</label>
      <input type="date" id="dateField">
    </div>

    <div class="sheet-divider"></div>

    <button class="sheet-action" id="exportCsvBtn"><span class="sa-icon">⭳</span><span id="actExportLabel"></span></button>
    <button class="sheet-action" id="printBtn"><span class="sa-icon">⎙</span><span id="actPrintLabel"></span></button>
    <button class="sheet-action danger" id="clearBtn"><span class="sa-icon">✕</span><span id="actClearLabel"></span></button>
  </div>

</div>

<script>
const RATE_KEYS = ["EXCELLENT", "GOOD", "AVERAGE", "WEAK"];
const RATE_CLASS = { EXCELLENT:"sel-excellent", GOOD:"sel-good", AVERAGE:"sel-average", WEAK:"sel-weak" };
const STORAGE_KEY = "student_followup_sheet_v2";
const LANG_KEY = "student_followup_lang";

const I18N = {
  ar: {
    dir: "rtl",
    pageTitle: "سجل متابعة الطلاب",
    title: "سجل متابعة الطلاب",
    subtitleWith: (c,s) => [c,s].filter(Boolean).join(" · ") || "بدون تفاصيل",
    lblClass: "الفصل",
    lblSubject: "المادة",
    lblDate: "التاريخ",
    classPh: "مثال: 7A",
    subjectPh: "اسم المادة",
    sheetTitle: "إعدادات الكشف",
    namePh: "اسم الطالب",
    colHomework: "الواجب",
    colClasswork: "الفصل",
    colParticipation: "المشاركة",
    colBehavior: "السلوك",
    colUnderstanding: "الفهم",
    colSupport: "الدعم",
    notesPh: "أضف ملاحظة...",
    exportCsv: "تصدير CSV",
    print: "طباعة / PDF",
    clearAll: "مسح كل البيانات",
    fabTitle: "إضافة طالب",
    countLabel: (n) => n === 0 ? "لا يوجد طلاب" : (n === 1 ? "طالب واحد" : n + " طلاب"),
    toastAdded: "تمت إضافة الطالب",
    toastDeleted: "تم حذف الطالب",
    emptyTitle: "مفيش طلاب لسه",
    emptyHint: "دوس على زرار + تحت عشان تضيف أول طالب",
    deleteConfirm: "حذف هذا الطالب؟",
    confirmClear: "هل تريد مسح كل البيانات في هذا الفصل؟ لا يمكن التراجع.",
    rateShort: { EXCELLENT:"ممتاز", GOOD:"جيد", AVERAGE:"متوسط", WEAK:"ضعيف" },
    nameHeader: "اسم الطالب",
    notesHeader: "ملاحظات",
    numHeader: "م"
  },
  en: {
    dir: "ltr",
    pageTitle: "Student Follow-up Sheet",
    title: "Follow-up Sheet",
    subtitleWith: (c,s) => [c,s].filter(Boolean).join(" · ") || "No details set",
    lblClass: "Class",
    lblSubject: "Subject",
    lblDate: "Date",
    classPh: "e.g. 7A",
    subjectPh: "Subject name",
    sheetTitle: "Sheet Settings",
    namePh: "Student name",
    colHomework: "Homework",
    colClasswork: "Classwork",
    colParticipation: "Participation",
    colBehavior: "Behavior",
    colUnderstanding: "Understanding",
    colSupport: "Support",
    notesPh: "Add a note...",
    exportCsv: "Export CSV",
    print: "Print / PDF",
    clearAll: "Clear all data",
    fabTitle: "Add student",
    countLabel: (n) => n === 0 ? "No students yet" : (n === 1 ? "1 student" : n + " students"),
    toastAdded: "Student added",
    toastDeleted: "Student removed",
    emptyTitle: "No students yet",
    emptyHint: "Tap the + button below to add your first student",
    deleteConfirm: "Delete this student?",
    confirmClear: "Clear all data for this class? This cannot be undone.",
    rateShort: { EXCELLENT:"Excellent", GOOD:"Good", AVERAGE:"Average", WEAK:"Weak" },
    nameHeader: "Student Name",
    notesHeader: "Notes",
    numHeader: "No."
  }
};

let lang = localStorage.getItem(LANG_KEY) || "ar";

let state = {
  classField: "",
  subjectField: "",
  dateField: "",
  students: []
};

function newStudent(){
  return { name:"", homework:"", classwork:"", participation:"", behavior:"", understanding:"", support:"", notes:"" };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){}
  if(!state.students) state.students = [];
}

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 1400);
}

function initials(name){
  const trimmed = (name || "").trim();
  if(!trimmed) return "?";
  const parts = trimmed.split(/\s+/);
  return parts[0].charAt(0).toUpperCase();
}

function renderMeta(){
  const t = I18N[lang];
  document.getElementById('appbarSub').textContent = t.subtitleWith(state.classField, state.subjectField);
  document.getElementById('classField').value = state.classField || "";
  document.getElementById('subjectField').value = state.subjectField || "";
  document.getElementById('dateField').value = state.dateField || "";
  document.getElementById('countBadge').textContent = t.countLabel(state.students.length);
}

function ratingRowsConfig(t){
  return [
    ["homework", t.colHomework],
    ["classwork", t.colClasswork],
    ["participation", t.colParticipation],
    ["behavior", t.colBehavior],
    ["understanding", t.colUnderstanding],
    ["support", t.colSupport]
  ];
}

function renderCards(){
  const t = I18N[lang];
  const content = document.getElementById('content');
  content.innerHTML = "";

  if(state.students.length === 0){
    const empty = document.createElement('div');
    empty.className = "empty-state";
    empty.innerHTML = "<div class=\"emoji\">📋</div><p><strong>" + t.emptyTitle + "</strong><br>" + t.emptyHint + "</p>";
    content.appendChild(empty);
    renderMeta();
    return;
  }

  state.students.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = "card";

    const head = document.createElement('div');
    head.className = "card-head";

    const avatar = document.createElement('div');
    avatar.className = "avatar";
    avatar.textContent = initials(s.name);
    head.appendChild(avatar);

    const nameInput = document.createElement('input');
    nameInput.className = "name-input";
    nameInput.type = "text";
    nameInput.placeholder = t.namePh;
    nameInput.value = s.name;
    nameInput.addEventListener('input', e => {
      s.name = e.target.value;
      avatar.textContent = initials(s.name);
      persist();
    });
    head.appendChild(nameInput);

    const delBtn = document.createElement('button');
    delBtn.className = "card-menu-btn";
    delBtn.textContent = "✕";
    delBtn.addEventListener('click', () => {
      if(confirm(t.deleteConfirm)){
        state.students.splice(i, 1);
        persist();
        renderCards();
        showToast(t.toastDeleted);
      }
    });
    head.appendChild(delBtn);

    card.appendChild(head);

    const grid = document.createElement('div');
    grid.className = "rating-grid";
    ratingRowsConfig(t).forEach(([col, label]) => {
      const row = document.createElement('div');
      row.className = "rating-row";

      const lbl = document.createElement('div');
      lbl.className = "rating-label";
      lbl.textContent = label;
      row.appendChild(lbl);

      const opts = document.createElement('div');
      opts.className = "rating-options";
      RATE_KEYS.forEach(key => {
        const chip = document.createElement('button');
        chip.type = "button";
        chip.className = "chip" + (s[col] === key ? " " + RATE_CLASS[key] : "");
        chip.textContent = t.rateShort[key];
        chip.addEventListener('click', () => {
          s[col] = (s[col] === key) ? "" : key;
          persist();
          renderCards();
        });
        opts.appendChild(chip);
      });
      row.appendChild(opts);
      grid.appendChild(row);
    });
    card.appendChild(grid);

    const notesWrap = document.createElement('div');
    notesWrap.className = "notes-wrap";
    const notesInput = document.createElement('input');
    notesInput.type = "text";
    notesInput.placeholder = t.notesPh;
    notesInput.value = s.notes;
    notesInput.addEventListener('input', e => { s.notes = e.target.value; persist(); });
    notesWrap.appendChild(notesInput);
    card.appendChild(notesWrap);

    content.appendChild(card);
  });

  renderMeta();
}

function applyLanguage(){
  const t = I18N[lang];
  const html = document.getElementById('htmlRoot');
  html.setAttribute('lang', lang);
  html.setAttribute('dir', t.dir);
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('titleText').textContent = t.title;
  document.getElementById('sheetTitle').textContent = t.sheetTitle;
  document.getElementById('lblClass').textContent = t.lblClass;
  document.getElementById('lblSubject').textContent = t.lblSubject;
  document.getElementById('lblDate').textContent = t.lblDate;
  document.getElementById('classField').placeholder = t.classPh;
  document.getElementById('subjectField').placeholder = t.subjectPh;
  document.getElementById('actExportLabel').textContent = t.exportCsv;
  document.getElementById('actPrintLabel').textContent = t.print;
  document.getElementById('actClearLabel').textContent = t.clearAll;
  document.getElementById('fabAdd').title = t.fabTitle;

  document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');

  renderCards();
}

function addStudent(){
  state.students.push(newStudent());
  persist();
  renderCards();
  showToast(I18N[lang].toastAdded);
  const inputs = document.querySelectorAll('.name-input');
  if(inputs.length){
    const last = inputs[inputs.length - 1];
    last.focus();
    last.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function exportCsv(){
  const t = I18N[lang];
  const cols = ratingRowsConfig(t);
  const headers = [t.numHeader, t.nameHeader, ...cols.map(c=>c[1]), t.notesHeader];
  const rows = state.students.map((s,i) => [
    i+1, s.name,
    ...cols.map(([col]) => s[col] ? t.rateShort[s[col]] : ""),
    s.notes
  ]);
  let csv = "\uFEFF" + headers.join(",") + "\n";
  rows.forEach(r => {
    csv += r.map(v => "\"" + String(v).replace(/"/g,'""') + "\"").join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const cls = state.classField ? state.classField.replace(/\s+/g,'_') : "class";
  const dt = state.dateField || new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "followup_" + cls + "_" + dt + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

function setLang(newLang){
  lang = newLang;
  localStorage.setItem(LANG_KEY, lang);
  applyLanguage();
}

function openSheet(){
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
}

document.getElementById('classField').addEventListener('input', e => { state.classField = e.target.value; persist(); renderMeta(); });
document.getElementById('subjectField').addEventListener('input', e => { state.subjectField = e.target.value; persist(); renderMeta(); });
document.getElementById('dateField').addEventListener('input', e => { state.dateField = e.target.value; persist(); });

document.getElementById('fabAdd').addEventListener('click', addStudent);
document.getElementById('exportCsvBtn').addEventListener('click', () => { exportCsv(); closeSheet(); });
document.getElementById('printBtn').addEventListener('click', () => { closeSheet(); setTimeout(()=>window.print(), 200); });
document.getElementById('clearBtn').addEventListener('click', () => {
  const t = I18N[lang];
  if(confirm(t.confirmClear)){
    state.students = [];
    state.classField = "";
    state.subjectField = "";
    state.dateField = "";
    persist();
    renderCards();
    closeSheet();
  }
});
document.getElementById('menuBtn').addEventListener('click', openSheet);
document.getElementById('sheetOverlay').addEventListener('click', closeSheet);

document.getElementById('btnAr').addEventListener('click', () => setLang('ar'));
document.getElementById('btnEn').addEventListener('click', () => setLang('en'));

loadState();
applyLanguage();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
