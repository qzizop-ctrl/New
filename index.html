<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">سجل متابعة الطلاب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow-up">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e3a5f;
    --navy-dark:#152a45;
    --bg:#eef1f6;
    --surface:#ffffff;
    --line:#e1e6ed;
    --ink:#1c2733;
    --muted:#7c8a9a;
    --accent:#2f6f5e;
    --excellent:#2e8b62;
    --excellent-bg:#e4f5ec;
    --good:#2f6f9f;
    --good-bg:#e6f0f9;
    --average:#c9891f;
    --average-bg:#fbf0dc;
    --weak:#c1483f;
    --weak-bg:#faeae8;
    --radius-card:16px;
    --radius-chip:10px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Tajawal', 'Inter', sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  html[dir="ltr"] body{ font-family:'Inter', 'Tajawal', sans-serif; }
  button, input, select{ font-family:inherit; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- App bar ---------- */
  .header-sticky{
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 2px 8px rgba(21,42,69,.25);
  }
  .appbar{
    background:var(--navy);
    color:#fff;
    padding:14px 14px 10px;
  }
  .appbar-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .appbar-title{ flex:1; min-width:0; }
  .appbar-title h1{
    margin:0;
    font-size:18px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .appbar-sub{
    margin:2px 0 0;
    font-size:12px;
    color:#c3d0e0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,.28);}
  .lang-pill{
    display:flex;
    border-radius:20px;
    background:rgba(255,255,255,.14);
    overflow:hidden;
    flex-shrink:0;
  }
  .lang-pill button{
    border:none;
    background:transparent;
    color:#dbe6f2;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    cursor:pointer;
  }
  .lang-pill button.active{
    background:#fff;
    color:var(--navy);
    border-radius:20px;
  }

  /* ---------- App logo (home screen) ---------- */
  .app-logo{
    width:30px;
    height:30px;
    border-radius:8px;
    flex-shrink:0;
    display:none;
  }

  /* ---------- Home: class list ---------- */
  .class-card{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--surface);
    border-radius:var(--radius-card);
    box-shadow:0 1px 2px rgba(21,42,69,.06), 0 1px 8px rgba(21,42,69,.05);
    padding:14px;
    margin-bottom:12px;
    cursor:pointer;
  }
  .class-card:active{ background:#f5f8fb; }
  .class-card-icon{
    width:46px; height:46px; border-radius:13px;
    background:var(--navy); color:#fff; font-weight:900; font-size:18px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .class-card-body{ flex:1; min-width:0; }
  .class-card-name{ font-size:16px; font-weight:800; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .class-card-meta{ font-size:12.5px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .class-card-actions{ display:flex; gap:4px; flex-shrink:0; }
  .class-card-actions button{
    width:30px; height:30px; border-radius:50%; border:none;
    background:var(--bg); color:var(--muted); font-size:13px; cursor:pointer;
  }
  .class-card-actions button.mc-delete{ color:var(--weak); }
  .class-card-chevron{ color:var(--muted); font-size:20px; flex-shrink:0; }

  .content.anim-in{ animation:contentFadeIn .2s ease; }
  @keyframes contentFadeIn{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- Date nav ---------- */
  .date-nav{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px 0;
  }
  .date-nav button.nav-arrow{
    width:32px;
    height:32px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--navy);
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    flex-shrink:0;
  }
  .date-nav input[type="date"]{
    flex:1;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:10px;
    padding:8px 10px;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    text-align:center;
  }
  .date-nav input[type="date"]:focus{ outline:none; border-color:var(--navy); }
  .today-btn{
    flex-shrink:0;
    border:1.5px solid var(--navy);
    background:var(--surface);
    color:var(--navy);
    font-size:12.5px;
    font-weight:800;
    padding:0 12px;
    height:32px;
    border-radius:10px;
    cursor:pointer;
  }

  /* ---------- Search / count row ---------- */
  .subbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px 0;
  }
  .subbar-count{ padding:8px 14px 4px; }
  .count-badge{ font-size:12.5px; font-weight:700; color:var(--muted); }

  .search-wrap{ flex:1; position:relative; display:flex; align-items:center; }
  .search-icon{
    position:absolute;
    inset-inline-start:12px;
    color:var(--muted);
    font-size:16px;
    pointer-events:none;
  }
  .search-input{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:12px;
    padding:10px 38px;
    font-size:14px;
    color:var(--ink);
  }
  .search-input:focus{ outline:none; border-color:var(--navy); }
  .search-clear{
    position:absolute;
    inset-inline-end:8px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:var(--line);
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- Content ---------- */
  .content{ flex:1; padding:8px 14px calc(96px + var(--safe-bottom)); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .emoji{font-size:40px; margin-bottom:10px;}
  .empty-state p{margin:0; font-size:14.5px; line-height:1.6;}
  .empty-state button.cta{
    margin-top:14px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 20px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  .no-results{ text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }

  /* ---------- Student card ---------- */
  .card{
    background:var(--surface);
    border-radius:var(--radius-card);
    box-shadow:0 1px 2px rgba(21,42,69,.06), 0 1px 8px rgba(21,42,69,.05);
    margin-bottom:12px;
    overflow:hidden;
  }
  .card-head{ display:flex; align-items:center; gap:10px; padding:12px 12px 8px; }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background:var(--navy); color:#fff; font-weight:900; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-head input.name-input{
    flex:1; min-width:0; border:none; background:transparent;
    font-size:16px; font-weight:700; color:var(--ink);
    padding:8px 4px; border-bottom:1.5px solid transparent;
  }
  .card-head input.name-input:focus{ outline:none; border-bottom-color:var(--navy); }
  .card-menu-btn{
    width:32px; height:32px; border-radius:50%; border:none;
    background:transparent; color:var(--muted); font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .card-menu-btn:active{background:var(--bg);}

  .rating-grid{ padding:2px 12px 10px; display:flex; flex-direction:column; gap:7px; }
  .rating-row{ display:flex; align-items:center; gap:8px; }
  .rating-label{ width:78px; flex-shrink:0; font-size:12.5px; color:var(--muted); font-weight:700; }
  .rating-options{ flex:1; display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; }
  .chip{
    border:1.5px solid var(--line); background:var(--surface); color:var(--muted);
    font-size:11.5px; font-weight:700; border-radius:var(--radius-chip);
    padding:7px 2px; text-align:center; cursor:pointer; line-height:1.2;
  }
  .chip.sel-excellent{ background:var(--excellent-bg); border-color:var(--excellent); color:var(--excellent); }
  .chip.sel-good{ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .chip.sel-average{ background:var(--average-bg); border-color:var(--average); color:var(--average); }
  .chip.sel-weak{ background:var(--weak-bg); border-color:var(--weak); color:var(--weak); }

  .notes-wrap{ padding:0 12px 12px; }
  .notes-wrap input{
    width:100%; border:none; background:var(--bg); border-radius:10px;
    padding:10px 12px; font-size:13.5px; color:var(--ink);
  }
  .notes-wrap input:focus{outline:1.5px solid var(--navy);}

  .unsaved-bar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    margin:0 12px 12px; padding:9px 12px;
    background:var(--average-bg); border:1.5px solid var(--average); border-radius:10px;
  }
  .unsaved-bar.show{ display:flex; }
  .unsaved-text{ font-size:12px; font-weight:700; color:var(--average); }
  .save-btn{
    background:var(--average); color:#fff; border:none; border-radius:8px;
    padding:7px 16px; font-size:12.5px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .save-btn:active{ filter:brightness(0.92); }

  .locked-bar{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin:0 12px 12px; padding:9px 12px;
    background:var(--excellent-bg); border:1.5px solid var(--excellent); border-radius:10px;
  }
  .locked-text{ font-size:12px; font-weight:700; color:var(--excellent); display:flex; align-items:center; gap:6px; }
  .edit-btn{
    background:var(--surface); color:var(--excellent); border:1.5px solid var(--excellent); border-radius:8px;
    padding:6px 15px; font-size:12.5px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .edit-btn:active{ background:var(--excellent-bg); }

  .avatar-wrap{ position:relative; flex-shrink:0; }
  .avatar-badge{
    position:absolute; bottom:-2px; inset-inline-end:-2px;
    width:16px; height:16px; border-radius:50%;
    background:var(--excellent); color:#fff; font-size:10px; font-weight:900;
    display:flex; align-items:center; justify-content:center;
    border:2px solid var(--surface);
  }

  .card-head input.name-input[disabled]{
    color:var(--muted);
    cursor:default;
  }
  .notes-wrap input[disabled]{
    color:var(--muted);
    cursor:default;
  }
  .rating-options.locked{ pointer-events:none; }
  .rating-options.locked .chip:not(.sel-excellent):not(.sel-good):not(.sel-average):not(.sel-weak){
    opacity:.35;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    bottom:calc(24px + var(--safe-bottom));
    inset-inline-end:calc(50% - 280px + 20px);
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:26px;
    box-shadow:0 4px 14px rgba(47,111,94,.45);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:15;
  }
  .fab:active{ filter:brightness(0.92); }
  @media (max-width:600px){ .fab{ inset-inline-end:20px; } }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-dark); color:#fff; font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:30px; opacity:0;
    transition:opacity .2s ease, transform .2s ease; z-index:40; pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(20,30,45,.45); z-index:50; display:none; }
  .sheet-overlay.open{ display:block; }
  .bottom-sheet{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(100%);
    width:100%; max-width:560px; background:var(--surface); border-radius:20px 20px 0 0;
    z-index:51; transition:transform .25s ease; max-height:88vh; overflow-y:auto;
    padding-bottom:calc(20px + var(--safe-bottom));
  }
  .bottom-sheet.open{ transform:translateX(-50%) translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 4px; }
  .sheet-title{ font-size:16px; font-weight:900; color:var(--navy); padding:10px 20px 4px; }
  .sheet-field{ padding:10px 20px; }
  .sheet-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .sheet-field input{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
    font-size:14.5px; color:var(--ink); background:var(--bg);
  }
  .sheet-field input:focus{ outline:none; border-color:var(--navy); }
  .sheet-divider{ height:1px; background:var(--line); margin:10px 20px; }
  .sheet-action{
    display:flex; align-items:center; gap:12px; width:100%; border:none; background:none;
    padding:14px 20px; font-size:14.5px; font-weight:700; color:var(--ink); text-align:start; cursor:pointer;
  }
  .sheet-action:active{ background:var(--bg); }
  .sheet-action.danger{ color:var(--weak); }
  .sheet-action .sa-icon{ width:22px; text-align:center; font-size:16px; flex-shrink:0; }

  @media (max-width:380px){
    .rating-label{ width:64px; font-size:11.5px; }
    .chip{ font-size:10.5px; padding:6px 2px; }
  }

  @media print{
    .appbar, .fab, .toast, .sheet-overlay, .bottom-sheet, .card-menu-btn, .date-nav, .subbar{ display:none !important; }
    body{ background:#fff; }
    body.print-full-export .app > *:not(#printArea){ display:none !important; }
    body.print-full-export #printArea{ display:block !important; padding:16px; }
  }

  #printArea{ display:none; }
  #printArea{
    font-family:'Tajawal','Inter',sans-serif;
    color:#000;
  }
  #printArea .pdf-class-title{ font-size:20px; font-weight:900; color:#1e3a5f; margin:0 0 2px; }
  #printArea .pdf-class-subject{ font-size:13px; color:#555; margin:0 0 14px; }
  #printArea .pdf-date-title{ font-size:14px; font-weight:800; color:#1e3a5f; margin:18px 0 6px; border-bottom:1.5px solid #1e3a5f; padding-bottom:4px; }
  #printArea .pdf-empty{ font-size:13px; color:#777; }
  #printArea table.pdf-table{
    width:100%;
    border-collapse:collapse;
    margin-bottom:6px;
    font-size:11.5px;
  }
  #printArea table.pdf-table th,
  #printArea table.pdf-table td{
    border:1px solid #ccc;
    padding:5px 6px;
    text-align:center;
  }
  #printArea table.pdf-table thead{ display:table-header-group; }
  #printArea table.pdf-table th{ background:#eef1f6; font-weight:800; }
  #printArea table.pdf-table td:first-child,
  #printArea table.pdf-table th:first-child{ text-align:start; }
  #printArea .pdf-pagebreak{ page-break-after:always; }
</style>
</head>
<body>

<div class="app">

  <div class="header-sticky">
    <div class="appbar">
      <div class="appbar-row">
        <button class="icon-btn" id="backBtn" style="display:none;">‹</button>
        <img src="icon-192.png" class="app-logo" id="appLogo" alt="">
        <div class="appbar-title">
          <h1 id="titleText">سجل متابعة الطلاب</h1>
          <p class="appbar-sub" id="appbarSub">—</p>
        </div>
        <div class="lang-pill">
          <button id="btnAr" class="active">AR</button>
          <button id="btnEn">EN</button>
        </div>
        <button class="icon-btn" id="menuBtn" title="Menu">⋮</button>
      </div>
    </div>

    <div class="date-nav" id="dateNavWrap" style="display:none;">
      <button class="nav-arrow" id="datePrev">‹</button>
      <input type="date" id="dateInput">
      <button class="nav-arrow" id="dateNext">›</button>
      <button class="today-btn" id="todayBtn"></button>
    </div>
  </div>

  <div class="subbar" id="searchRow" style="display:none;">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" class="search-input">
      <button class="search-clear" id="searchClear" style="display:none;">✕</button>
    </div>
  </div>
  <div class="subbar subbar-count" id="countRow" style="display:none;">
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div class="content" id="content"></div>

  <button class="fab" id="fabAdd" title="">+</button>
  <div class="toast" id="toast"></div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">إعدادات الفصل</div>

    <div id="sheetHomeSection" style="display:none;">
      <button class="sheet-action" id="exportAllPdfBtn"><span class="sa-icon">🖨</span><span id="actExportAllPdfLabel"></span></button>
    </div>

    <div id="sheetClassSection">
      <div class="sheet-field">
        <label id="lblSubject">المادة</label>
        <input type="text" id="subjectField">
      </div>

      <div class="sheet-divider"></div>

      <button class="sheet-action" id="exportClassPdfBtn"><span class="sa-icon">🖨</span><span id="actExportClassPdfLabel"></span></button>
      <button class="sheet-action" id="printBtn"><span class="sa-icon">⎙</span><span id="actPrintLabel"></span></button>
      <button class="sheet-action" id="exportCsvBtn"><span class="sa-icon">⭳</span><span id="actExportLabel"></span></button>
      <button class="sheet-action danger" id="clearDayBtn"><span class="sa-icon">✕</span><span id="actClearDayLabel"></span></button>
      <button class="sheet-action danger" id="deleteClassBtn"><span class="sa-icon">🗑</span><span id="actDeleteClassLabel"></span></button>
    </div>
  </div>

  <div id="printArea"></div>

</div>

<script>
const RATE_KEYS = ["EXCELLENT", "GOOD", "AVERAGE", "WEAK"];
const RATE_CLASS = { EXCELLENT:"sel-excellent", GOOD:"sel-good", AVERAGE:"sel-average", WEAK:"sel-weak" };
const FIELDS = ["homework","classwork","participation","behavior","understanding","support"];
const STORAGE_KEY = "student_followup_sheet_v3";
const OLD_STORAGE_KEY = "student_followup_sheet_v2";
const LANG_KEY = "student_followup_lang";

const I18N = {
  ar: {
    dir: "rtl",
    pageTitle: "سجل متابعة الطلاب",
    title: "سجل متابعة الطلاب",
    subtitleWith: (subject) => subject || "بدون مادة محددة",
    homeSubtitle: (n) => n === 0 ? "ابدأ بإضافة أول فصل" : (n === 1 ? "فصل واحد" : n + " فصول"),
    lblSubject: "المادة",
    subjectPh: "اسم المادة",
    sheetTitle: "إعدادات الفصل",
    namePh: "اسم الطالب",
    colHomework: "الواجب",
    colClasswork: "الفصل",
    colParticipation: "المشاركة",
    colBehavior: "السلوك",
    colUnderstanding: "الفهم",
    colSupport: "الدعم",
    notesPh: "أضف ملاحظة...",
    exportCsv: "تصدير CSV لليوم ده",
    print: "طباعة الشاشة الحالية",
    exportClassPdf: "تصدير الفصل PDF (كل الأيام)",
    exportAllClassesPdf: "تصدير كل الفصول PDF",
    homeSheetTitle: "خيارات عامة",
    noDataForPdf: "لا توجد بيانات مسجلة لهذا الفصل بعد.",

let lang = localStorage.getItem(LANG_KEY) || "ar";
let searchQuery = "";

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}
function shiftDate(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,'0') + "-" + String(dt.getDate()).padStart(2,'0');
}

let state = {
  classes: [],
  currentClassId: null,
  currentDate: todayStr()
};

function blankDayFields(){
  return { homework:"", classwork:"", participation:"", behavior:"", understanding:"", support:"", notes:"", _dirty:false, locked:false };
}

function migrateFromV2(){
  try{
    const raw = localStorage.getItem(OLD_STORAGE_KEY);
    if(!raw) return false;
    const old = JSON.parse(raw);
    if(!old || !old.students || old.students.length === 0) return false;
    const t = I18N[lang];
    const clsId = uid();
    const dateStr = old.dateField || todayStr();
    const students = old.students.map(s => ({ id: uid(), name: s.name || "" }));
    const dayRecord = {};
    old.students.forEach((s, i) => {
      dayRecord[students[i].id] = {
        homework: s.homework || "", classwork: s.classwork || "", participation: s.participation || "",
        behavior: s.behavior || "", understanding: s.understanding || "", support: s.support || "",
        notes: s.notes || "", locked: true
      };
    });
    const cls = {
      id: clsId,
      name: old.classField || t.defaultClassName,
      subject: old.subjectField || "",
      students: students,
      days: { [dateStr]: dayRecord }
    };
    state.classes = [cls];
    state.currentClassId = clsId;
    state.currentDate = dateStr;
    return true;
  }catch(e){ return false; }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.classes) state = parsed;
    } else {
      migrateFromV2();
    }
  }catch(e){}

  if(!state.classes) state.classes = [];
  state.classes.forEach(c => {
    if(!c.students) c.students = [];
    if(!c.days) c.days = {};
    c.students.forEach(s => { s._dirty = false; });
  });
  if(!state.currentDate) state.currentDate = todayStr();
  if(!state.currentClassId && state.classes.length){
    state.currentClassId = state.classes[0].id;
  }
}

function persist(){
  const cleanClasses = state.classes.map(c => {
    const cleanStudents = c.students.map(s => {
      const copy = Object.assign({}, s);
      delete copy._dirty;
      return copy;
    });
    const cleanDays = {};
    Object.keys(c.days || {}).forEach(dateStr => {
      const dayObj = c.days[dateStr];
      const cleanDay = {};
      Object.keys(dayObj).forEach(sid => {
        const rec = Object.assign({}, dayObj[sid]);
        delete rec._dirty;
        cleanDay[sid] = rec;
      });
      cleanDays[dateStr] = cleanDay;
    });
    return { id: c.id, name: c.name, subject: c.subject || "", students: cleanStudents, days: cleanDays };
  });
  const toSave = { classes: cleanClasses, currentClassId: state.currentClassId, currentDate: state.currentDate };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1400);
}

function initials(name){
  const trimmed = (name || "").trim();
  if(!trimmed) return "?";
  return trimmed.charAt(0).toUpperCase();
}

function getCurrentClass(){
  return state.classes.find(c => c.id === state.currentClassId) || null;
}

function ensureStudentDay(cls, dateStr, studentId){
  if(!cls.days) cls.days = {};
  if(!cls.days[dateStr]) cls.days[dateStr] = {};
  if(!cls.days[dateStr][studentId]) cls.days[dateStr][studentId] = blankDayFields();
  return cls.days[dateStr][studentId];
}

function matchesSearch(s){
  if(!searchQuery) return true;
  return (s.name || "").toLowerCase().includes(searchQuery);
}

function ratingRowsConfig(t){
  return [
    ["homework", t.colHomework],
    ["classwork", t.colClasswork],
    ["participation", t.colParticipation],
    ["behavior", t.colBehavior],
    ["understanding", t.colUnderstanding],
    ["support", t.colSupport]
  ];
}

let screen = "home";

function openClass(classId){
  state.currentClassId = classId;
  screen = "class";
  searchQuery = "";
  history.pushState({ screen: "class", classId }, "", "#class");
  renderApp();
}

function goHome(){
  screen = "home";
  renderApp();
}

window.addEventListener('popstate', (e) => {
  const st = e.state;
  if(st && st.screen === "class" && st.classId){
    state.currentClassId = st.classId;
    screen = "class";
  } else {
    screen = "home";
  }
  renderApp();
});

function addClass(){
  const t = I18N[lang];
  const name = prompt(t.newClassPrompt, "");
  if(name === null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  const cls = { id: uid(), name: trimmed, subject: "", students: [], days: {} };
  state.classes.push(cls);
  persist();
  showToast(t.toastClassAdded);
  openClass(cls.id);
}

function renameClass(c){
  const t = I18N[lang];
  const newName = prompt(t.renameClassPrompt, c.name);
  if(newName === null) return;
  const trimmed = newName.trim();
  if(!trimmed) return;
  c.name = trimmed;
  persist();
  renderApp();
}

function deleteClass(c){
  const t = I18N[lang];
  if(!confirm(t.confirmDeleteClass)) return;
  const idx = state.classes.findIndex(x => x.id === c.id);
  if(idx >= 0) state.classes.splice(idx, 1);
  if(state.currentClassId === c.id) state.currentClassId = null;
  persist();
  showToast(t.toastClassDeleted);
  if(screen === "class"){
    history.back();
  } else {
    renderApp();
  }
}

/* ---------------- Home screen: class list ---------------- */
function renderHomeList(){
  const t = I18N[lang];
  const content = document.getElementById('content');
  content.innerHTML = "";

  if(state.classes.length === 0){
    const empty = document.createElement('div');
    empty.className = "empty-state";
    empty.innerHTML = "<div class=\"emoji\">🏫</div><p><strong>" + t.emptyTitleNoClass + "</strong><br>" + t.emptyHintNoClass + "</p>";
    const btn = document.createElement('button');
    btn.className = "cta";
    btn.textContent = t.addFirstClassBtn;
    btn.addEventListener('click', addClass);
    empty.appendChild(btn);
    content.appendChild(empty);
    return;
  }

  state.classes.forEach(c => {
    const card = document.createElement('div');
    card.className = "class-card";
    card.addEventListener('click', () => openClass(c.id));

    const icon = document.createElement('div');
    icon.className = "class-card-icon";
    icon.textContent = (c.name || "?").charAt(0).toUpperCase();
    card.appendChild(icon);

    const body = document.createElement('div');
    body.className = "class-card-body";
    const nameEl = document.createElement('div');
    nameEl.className = "class-card-name";
    nameEl.textContent = c.name;
    const metaEl = document.createElement('div');
    metaEl.className = "class-card-meta";
    metaEl.textContent = [c.subject || t.subtitleWith(""), t.countLabel(c.students.length)].filter(Boolean).join(" · ");
    body.appendChild(nameEl);
    body.appendChild(metaEl);
    card.appendChild(body);

    const actions = document.createElement('div');
    actions.className = "class-card-actions";
    const renameBtn = document.createElement('button');
    renameBtn.textContent = "✎";
    renameBtn.addEventListener('click', (e) => { e.stopPropagation(); renameClass(c); });
    const delBtn = document.createElement('button');
    delBtn.className = "mc-delete";
    delBtn.textContent = "✕";
    delBtn.addEventListener('click', (e) => { e.stopPropagation(); deleteClass(c); });
    actions.appendChild(renameBtn);
    actions.appendChild(delBtn);
    card.appendChild(actions);

    const chevron = document.createElement('div');
    chevron.className = "class-card-chevron";
    chevron.textContent = (lang === 'ar') ? "‹" : "›";
    card.appendChild(chevron);

    content.appendChild(card);
  });
}

function updateChrome(){
  const t = I18N[lang];
  const isHome = screen === "home" || !getCurrentClass();
  document.getElementById('backBtn').style.display = isHome ? 'none' : 'flex';
  document.getElementById('appLogo').style.display = isHome ? 'block' : 'none';
  document.getElementById('dateNavWrap').style.display = isHome ? 'none' : 'flex';
  document.getElementById('searchRow').style.display = isHome ? 'none' : 'flex';
  document.getElementById('countRow').style.display = isHome ? 'none' : 'flex';

  if(isHome){
    document.getElementById('titleText').textContent = t.title;
    document.getElementById('appbarSub').textContent = t.homeSubtitle(state.classes.length);
    document.getElementById('fabAdd').title = t.addClassFabTitle;
  } else {
    const cls = getCurrentClass();
    document.getElementById('titleText').textContent = cls.name;
    document.getElementById('appbarSub').textContent = t.subtitleWith(cls.subject);
    document.getElementById('subjectField').value = cls.subject || "";
    document.getElementById('fabAdd').title = t.fabTitle;
  }
}

function renderApp(){
  updateChrome();
  const isHome = screen === "home" || !getCurrentClass();
  if(isHome){
    renderHomeList();
  } else {
    renderDateNav();
    renderCards();
  }
  const contentEl = document.getElementById('content');
  contentEl.classList.remove('anim-in');
  void contentEl.offsetWidth;
  contentEl.classList.add('anim-in');
}

/* ---------------- Cards ---------------- */
function renderCards(){
  const t = I18N[lang];
  const content = document.getElementById('content');
  content.innerHTML = "";

  const cls = getCurrentClass();
  if(!cls){ goHome(); return; }

  const visibleCountAll = cls.students.filter(matchesSearch).length;
  document.getElementById('countBadge').textContent = t.countLabel(visibleCountAll);

  if(cls.students.length === 0){
    const empty = document.createElement('div');
    empty.className = "empty-state";
    empty.innerHTML = "<div class=\"emoji\">📋</div><p><strong>" + t.emptyTitle + "</strong><br>" + t.emptyHint + "</p>";
    content.appendChild(empty);
    return;
  }

  const visible = cls.students
    .map((s, idx) => ({ s, idx }))
    .filter(({ s }) => matchesSearch(s));

  if(visible.length === 0){
    const noRes = document.createElement('div');
    noRes.className = "no-results";
    noRes.innerHTML = "<strong>" + t.noResultsTitle + "</strong><br>" + t.noResultsHint;
    content.appendChild(noRes);
    return;
  }

  visible.forEach(({ s, idx }) => {
    const dayRec = ensureStudentDay(cls, state.currentDate, s.id);
    const locked = !!dayRec.locked;

    const card = document.createElement('div');
    card.className = "card";

    const head = document.createElement('div');
    head.className = "card-head";

    const avatarWrap = document.createElement('div');
    avatarWrap.className = "avatar-wrap";
    const avatar = document.createElement('div');
    avatar.className = "avatar";
    avatar.textContent = initials(s.name);
    avatarWrap.appendChild(avatar);
    if(locked){
      const badge = document.createElement('div');
      badge.className = "avatar-badge";
      badge.textContent = "✓";
      avatarWrap.appendChild(badge);
    }
    head.appendChild(avatarWrap);

    const nameInput = document.createElement('input');
    nameInput.className = "name-input";
    nameInput.type = "text";
    nameInput.placeholder = t.namePh;
    nameInput.value = s.name;
    nameInput.disabled = locked;
    head.appendChild(nameInput);

    const delBtn = document.createElement('button');
    delBtn.className = "card-menu-btn";
    delBtn.textContent = "✕";
    delBtn.addEventListener('click', () => {
      if(confirm(t.deleteConfirm)){
        cls.students.splice(idx, 1);
        Object.keys(cls.days || {}).forEach(dateStr => {
          delete cls.days[dateStr][s.id];
        });
        persist();
        renderCards();
        showToast(t.toastDeleted);
      }
    });
    head.appendChild(delBtn);

    card.appendChild(head);

    const grid = document.createElement('div');
    grid.className = "rating-grid";
    ratingRowsConfig(t).forEach(([col, label]) => {
      const row = document.createElement('div');
      row.className = "rating-row";

      const lbl = document.createElement('div');
      lbl.className = "rating-label";
      lbl.textContent = label;
      row.appendChild(lbl);

      const opts = document.createElement('div');
      opts.className = "rating-options" + (locked ? " locked" : "");
      RATE_KEYS.forEach(key => {
        const chip = document.createElement('button');
        chip.type = "button";
        chip.className = "chip" + (dayRec[col] === key ? " " + RATE_CLASS[key] : "");
        chip.textContent = t.rateShort[key];
        if(!locked){
          chip.addEventListener('click', () => {
            dayRec[col] = (dayRec[col] === key) ? "" : key;
            dayRec._dirty = true;
            renderCards();
          });
        }
        opts.appendChild(chip);
      });
      row.appendChild(opts);
      grid.appendChild(row);
    });
    card.appendChild(grid);

    const notesWrap = document.createElement('div');
    notesWrap.className = "notes-wrap";
    const notesInput = document.createElement('input');
    notesInput.type = "text";
    notesInput.placeholder = t.notesPh;
    notesInput.value = dayRec.notes;
    notesInput.disabled = locked;
    notesWrap.appendChild(notesInput);
    card.appendChild(notesWrap);

    if(locked){
      const lockedBar = document.createElement('div');
      lockedBar.className = "locked-bar";
      const lockedLabel = document.createElement('span');
      lockedLabel.className = "locked-text";
      lockedLabel.textContent = "✓ " + t.lockedText;
      const editBtn = document.createElement('button');
      editBtn.className = "edit-btn";
      editBtn.textContent = t.editBtn;
      editBtn.addEventListener('click', () => {
        dayRec.locked = false;
        renderCards();
      });
      lockedBar.appendChild(lockedLabel);
      lockedBar.appendChild(editBtn);
      card.appendChild(lockedBar);
    } else {
      const unsavedBar = document.createElement('div');
      unsavedBar.className = "unsaved-bar" + ((s._dirty || dayRec._dirty) ? " show" : "");
      const unsavedLabel = document.createElement('span');
      unsavedLabel.className = "unsaved-text";
      unsavedLabel.textContent = t.unsavedText;
      const saveBtn = document.createElement('button');
      saveBtn.className = "save-btn";
      saveBtn.textContent = t.saveBtn;
      saveBtn.addEventListener('click', () => {
        s._dirty = false;
        dayRec._dirty = false;
        dayRec.locked = true;
        persist();
        renderCards();
        showToast(t.toastSaved);
      });
      unsavedBar.appendChild(unsavedLabel);
      unsavedBar.appendChild(saveBtn);
      card.appendChild(unsavedBar);

      nameInput.addEventListener('input', e => {
        s.name = e.target.value;
        avatar.textContent = initials(s.name);
        s._dirty = true;
        unsavedBar.classList.add('show');
      });
      notesInput.addEventListener('input', e => {
        dayRec.notes = e.target.value;
        dayRec._dirty = true;
        unsavedBar.classList.add('show');
      });
    }

    content.appendChild(card);
  });
}

function addStudent(){
  const t = I18N[lang];
  const cls = getCurrentClass();
  if(!cls){ addClass(); return; }
  cls.students.push({ id: uid(), name: "", _dirty:false });
  persist();
  renderCards();
  showToast(t.toastAdded);
  const inputs = document.querySelectorAll('.name-input');
  if(inputs.length){
    const last = inputs[inputs.length - 1];
    last.focus();
    last.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function exportCsv(){
  const t = I18N[lang];
  const cls = getCurrentClass();
  if(!cls) return;
  const cols = ratingRowsConfig(t);
  const headers = [t.numHeader, t.nameHeader, ...cols.map(c=>c[1]), t.notesHeader];
  const rows = cls.students.map((s,i) => {
    const rec = (cls.days[state.currentDate] && cls.days[state.currentDate][s.id]) || blankDayFields();
    return [
      i+1, s.name,
      ...cols.map(([col]) => rec[col] ? t.rateShort[rec[col]] : ""),
      rec.notes || ""
    ];
  });
  let csv = "\uFEFF" + headers.join(",") + "\n";
  rows.forEach(r => {
    csv += r.map(v => "\"" + String(v).replace(/"/g,'""') + "\"").join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const clsName = (cls.name || "class").replace(/\s+/g,'_');
  a.href = url;
  a.download = "followup_" + clsName + "_" + state.currentDate + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

function setLang(newLang){
  lang = newLang;
  localStorage.setItem(LANG_KEY, lang);
  applyLanguage();
}

function escapeHtml(str){
  return String(str == null ? "" : str).replace(/[&<>"']/g, m => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]
  ));
}

function buildDayTableHtml(cls, dateStr, cols, t){
  const day = (cls.days && cls.days[dateStr]) || {};
  const headers = "<th>" + escapeHtml(t.nameHeader) + "</th>" +
    cols.map(([, label]) => "<th>" + escapeHtml(label) + "</th>").join("") +
    "<th>" + escapeHtml(t.notesHeader) + "</th>";
  const rows = cls.students.map(s => {
    const rec = day[s.id] || {};
    const cells = cols.map(([key]) => "<td>" + (rec[key] ? escapeHtml(t.rateShort[rec[key]]) : "-") + "</td>").join("");
    return "<tr><td>" + escapeHtml(s.name || "-") + "</td>" + cells + "<td>" + escapeHtml(rec.notes || "") + "</td></tr>";
  }).join("");
  return "<table class=\"pdf-table\"><thead><tr>" + headers + "</tr></thead><tbody>" + rows + "</tbody></table>";
}

function buildClassPdfHtml(cls){
  const t = I18N[lang];
  const cols = ratingRowsConfig(t);
  const dates = Object.keys(cls.days || {}).filter(d => Object.keys(cls.days[d]).length > 0).sort();

  let html = "<div class=\"pdf-class-title\">" + escapeHtml(cls.name) + "</div>";
  html += "<div class=\"pdf-class-subject\">" + escapeHtml(cls.subject || t.subtitleWith("")) + "</div>";

  if(dates.length === 0){
    html += "<div class=\"pdf-empty\">" + escapeHtml(t.noDataForPdf) + "</div>";
  } else {
    dates.forEach(dateStr => {
      html += "<div class=\"pdf-date-title\">" + escapeHtml(dateStr) + "</div>";
      html += buildDayTableHtml(cls, dateStr, cols, t);
    });
  }
  return html;
}

function printFullExport(html){
  const area = document.getElementById('printArea');
  area.innerHTML = html;
  document.body.classList.add('print-full-export');
  const cleanup = () => {
    document.body.classList.remove('print-full-export');
    area.innerHTML = "";
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => window.print(), 50);
  setTimeout(cleanup, 4000);
}

function exportClassPdf(cls){
  if(!cls) return;
  printFullExport(buildClassPdfHtml(cls));
}

function exportAllClassesPdf(){
  const t = I18N[lang];
  if(state.classes.length === 0){
    alert(t.noClassesForPdf);
    return;
  }
  const html = state.classes.map(c => buildClassPdfHtml(c)).join("<div class=\"pdf-pagebreak\"></div>");
  printFullExport(html);
}

function openSheet(){
  const isHome = screen === "home" || !getCurrentClass();
  document.getElementById('sheetHomeSection').style.display = isHome ? 'block' : 'none';
  document.getElementById('sheetClassSection').style.display = isHome ? 'none' : 'block';
  document.getElementById('sheetTitle').textContent = isHome ? I18N[lang].homeSheetTitle : I18N[lang].sheetTitle;
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
}

document.getElementById('subjectField').addEventListener('input', e => {
  const cls = getCurrentClass();
  if(!cls) return;
  cls.subject = e.target.value;
  persist();
  const t = I18N[lang];
  document.getElementById('appbarSub').textContent = t.subtitleWith(cls.subject);
});

document.getElementById('fabAdd').addEventListener('click', () => {
  if(screen === "home" || !getCurrentClass()) addClass();
  else addStudent();
});
document.getElementById('backBtn').addEventListener('click', () => history.back());
document.getElementById('exportCsvBtn').addEventListener('click', () => { exportCsv(); closeSheet(); });
document.getElementById('exportClassPdfBtn').addEventListener('click', () => {
  const cls = getCurrentClass();
  closeSheet();
  exportClassPdf(cls);
});
document.getElementById('exportAllPdfBtn').addEventListener('click', () => {
  closeSheet();
  exportAllClassesPdf();
});
document.getElementById('printBtn').addEventListener('click', () => { closeSheet(); setTimeout(()=>window.print(), 200); });
document.getElementById('clearDayBtn').addEventListener('click', () => {
  const t = I18N[lang];
  const cls = getCurrentClass();
  if(!cls) return;
  if(confirm(t.confirmClearDay)){
    cls.days[state.currentDate] = {};
    persist();
    renderCards();
    closeSheet();
  }
});
document.getElementById('deleteClassBtn').addEventListener('click', () => {
  const cls = getCurrentClass();
  if(!cls) return;
  closeSheet();
  deleteClass(cls);
});
document.getElementById('menuBtn').addEventListener('click', openSheet);
document.getElementById('sheetOverlay').addEventListener('click', closeSheet);

document.getElementById('btnAr').addEventListener('click', () => setLang('ar'));
document.getElementById('btnEn').addEventListener('click', () => setLang('en'));

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  document.getElementById('searchClear').style.display = e.target.value ? 'flex' : 'none';
  renderCards();
});
document.getElementById('searchClear').addEventListener('click', () => {
  const input = document.getElementById('searchInput');
  input.value = "";
  searchQuery = "";
  document.getElementById('searchClear').style.display = 'none';
  renderCards();
  input.focus();
});

document.getElementById('dateInput').addEventListener('change', e => {
  if(e.target.value){
    state.currentDate = e.target.value;
    persist();
    renderDateNav();
    renderCards();
  }
});
document.getElementById('datePrev').addEventListener('click', () => {
  state.currentDate = shiftDate(state.currentDate, -1);
  persist();
  renderDateNav();
  renderCards();
});
document.getElementById('dateNext').addEventListener('click', () => {
  state.currentDate = shiftDate(state.currentDate, 1);
  persist();
  renderDateNav();
  renderCards();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  state.currentDate = todayStr();
  persist();
  renderDateNav();
  renderCards();
});

window.addEventListener('beforeunload', (e) => {
  let hasUnsaved = false;
  state.classes.forEach(c => {
    c.students.forEach(s => { if(s._dirty) hasUnsaved = true; });
    Object.values(c.days || {}).forEach(day => {
      Object.values(day).forEach(rec => { if(rec._dirty) hasUnsaved = true; });
    });
  });
  if(hasUnsaved){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

loadState();
history.replaceState({ screen: "home" }, "", "#home");
applyLanguage();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
