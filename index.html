<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">سجل متابعة الطلاب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e3a5f;
    --navy-dark:#16293f;
    --paper:#f5f7fa;
    --line:#d7dee6;
    --row-alt:#eef2f7;
    --ink:#1c2733;
    --muted:#5b6b7c;
    --good:#2e7d5b;
    --warn:#c98a1f;
    --bad:#c14343;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal', 'Inter', sans-serif;
    background:var(--paper);
    color:var(--ink);
    padding:24px;
  }
  html[dir="ltr"] body{ font-family:'Inter', 'Tajawal', sans-serif; }

  .sheet{
    max-width:1400px;
    margin:0 auto;
    background:#fff;
    border-radius:10px;
    box-shadow:0 1px 3px rgba(30,58,95,.15);
    overflow:hidden;
  }
  .top{
    padding:22px 28px 18px;
    border-bottom:3px solid var(--navy);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    flex-wrap:wrap;
  }
  .top-main{flex:1; min-width:260px;}
  .top h1{
    margin:0 0 14px;
    font-size:26px;
    font-weight:900;
    color:var(--navy);
  }
  .meta{
    display:flex;
    flex-wrap:wrap;
    gap:18px;
  }
  .meta label{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:700;
    font-size:14px;
    color:var(--muted);
  }
  .meta input{
    font-family:inherit;
    font-size:14px;
    border:none;
    border-bottom:2px dashed var(--line);
    padding:4px 2px;
    min-width:120px;
    background:transparent;
    color:var(--ink);
  }
  .meta input:focus{outline:none; border-bottom-color:var(--navy);}

  .lang-switch{
    display:flex;
    border:1.5px solid var(--navy);
    border-radius:8px;
    overflow:hidden;
    height:36px;
    flex-shrink:0;
  }
  .lang-switch button{
    border:none;
    background:#fff;
    color:var(--navy);
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    padding:0 16px;
    cursor:pointer;
  }
  .lang-switch button.active{
    background:var(--navy);
    color:#fff;
  }

  .toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    padding:14px 28px;
    background:var(--row-alt);
    border-bottom:1px solid var(--line);
  }
  button{
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    cursor:pointer;
    transition:filter .15s ease;
  }
  button:hover{filter:brightness(0.92);}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-ghost{background:#fff; color:var(--navy); border:1px solid var(--line);}
  .btn-danger{background:#fff; color:var(--bad); border:1px solid var(--line);}
  .spacer{flex:1;}
  .save-note{
    align-self:center;
    font-size:12.5px;
    color:var(--muted);
  }

  .table-wrap{
    overflow-x:auto;
  }
  table{
    width:100%;
    border-collapse:collapse;
    min-width:1100px;
  }
  thead th{
    background:var(--navy);
    color:#fff;
    font-size:14px;
    font-weight:700;
    padding:12px 10px;
    text-align:center;
    white-space:nowrap;
    position:sticky;
    top:0;
  }
  tbody td{
    border-bottom:1px solid var(--line);
    border-inline-end:1px solid var(--line);
    padding:0;
  }
  tbody tr:nth-child(even){background:var(--row-alt);}
  tbody tr:hover{background:#e4ecf5;}

  td .cell-num{
    text-align:center;
    color:var(--muted);
    font-weight:700;
    padding:10px 6px;
    width:44px;
  }
  td input[type="text"]{
    width:100%;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:14px;
    padding:10px 10px;
    color:var(--ink);
  }
  td input[type="text"]:focus{outline:2px solid var(--navy); outline-offset:-2px;}
  .name-cell input{font-weight:700;}

  select.rate{
    width:100%;
    border:none;
    background:transparent;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    padding:10px 6px;
    text-align:center;
    text-align-last:center;
    color:var(--ink);
    cursor:pointer;
  }
  select.rate:focus{outline:2px solid var(--navy); outline-offset:-2px;}
  select.rate[data-val="EXCELLENT"]{color:var(--good);}
  select.rate[data-val="GOOD"]{color:#2f6f8f;}
  select.rate[data-val="AVERAGE"]{color:var(--warn);}
  select.rate[data-val="WEAK"]{color:var(--bad);}

  .notes-cell input{min-width:180px;}

  .row-actions{
    text-align:center;
    width:46px;
  }
  .del-row{
    background:none;
    border:none;
    color:var(--bad);
    font-size:17px;
    cursor:pointer;
    padding:6px;
    line-height:1;
  }
  .del-row:hover{opacity:.6;}

  .add-row-bar{
    padding:14px 28px;
    display:flex;
    justify-content:center;
    background:var(--row-alt);
  }

  @media print{
    body{padding:0; background:#fff;}
    .toolbar, .add-row-bar, .del-row, .row-actions, .lang-switch{display:none !important;}
    .sheet{box-shadow:none; border-radius:0;}
    select.rate{-webkit-appearance:none; appearance:none;}
  }

  @media (max-width:640px){
    .top{padding:16px 16px 14px;}
    .toolbar{padding:12px 16px;}
    .top h1{font-size:20px;}
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="top">
    <div class="top-main">
      <h1 id="titleText">سجل متابعة الطلاب</h1>
      <div class="meta">
        <label><span id="lblClass">الفصل</span> <input type="text" id="classField"></label>
        <label><span id="lblSubject">المادة</span> <input type="text" id="subjectField"></label>
        <label><span id="lblDate">التاريخ</span> <input type="date" id="dateField"></label>
      </div>
    </div>
    <div class="lang-switch">
      <button id="btnAr" class="active">AR</button>
      <button id="btnEn">EN</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-primary" id="addStudentBtn"></button>
    <button class="btn-ghost" id="exportCsvBtn"></button>
    <button class="btn-ghost" id="printBtn"></button>
    <button class="btn-danger" id="clearBtn"></button>
    <div class="spacer"></div>
    <span class="save-note" id="saveNote"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr id="headRow"></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="add-row-bar">
    <button class="btn-primary" id="addStudentBtn2"></button>
  </div>
</div>

<script>
const RATE_KEYS = ["", "EXCELLENT", "GOOD", "AVERAGE", "WEAK"];
const RATE_COLS = ["homework","classwork","participation","behavior","understanding","support"];
const STORAGE_KEY = "student_followup_sheet_v1";
const LANG_KEY = "student_followup_lang";

const I18N = {
  ar: {
    dir: "rtl",
    pageTitle: "سجل متابعة الطلاب",
    title: "سجل متابعة الطلاب",
    lblClass: "الفصل",
    lblSubject: "المادة",
    lblDate: "التاريخ",
    classPh: "مثال: 7A",
    subjectPh: "اسم المادة",
    colNum: "م",
    colName: "اسم الطالب",
    namePh: "اسم الطالب",
    colHomework: "الواجب",
    colClasswork: "الفصل",
    colParticipation: "المشاركة",
    colBehavior: "السلوك",
    colUnderstanding: "الفهم",
    colSupport: "الدعم",
    colNotes: "ملاحظات",
    notesPh: "ملاحظات إضافية",
    addStudent: "+ إضافة طالب",
    addStudent2: "+ إضافة طالب جديد",
    exportCsv: "تصدير CSV",
    print: "طباعة / PDF",
    clearAll: "مسح الكل",
    saveNoteDefault: "يتم الحفظ تلقائيًا على هذا الجهاز",
    saveNoteSaved: "تم الحفظ ✓",
    deleteRow: "حذف الطالب",
    confirmClear: "هل تريد مسح كل البيانات في هذا الفصل؟ لا يمكن التراجع.",
    rates: { "": "—", EXCELLENT:"ممتاز", GOOD:"جيد", AVERAGE:"متوسط", WEAK:"ضعيف" }
  },
  en: {
    dir: "ltr",
    pageTitle: "Student Follow-up Sheet",
    title: "Student Follow-up Sheet",
    lblClass: "Class",
    lblSubject: "Subject",
    lblDate: "Date",
    classPh: "e.g. 7A",
    subjectPh: "Subject name",
    colNum: "No.",
    colName: "Student Name",
    namePh: "Student name",
    colHomework: "Homework",
    colClasswork: "Classwork",
    colParticipation: "Participation",
    colBehavior: "Behavior",
    colUnderstanding: "Understanding",
    colSupport: "Support",
    colNotes: "Notes",
    notesPh: "Additional notes",
    addStudent: "+ Add Student",
    addStudent2: "+ Add New Student",
    exportCsv: "Export CSV",
    print: "Print / PDF",
    clearAll: "Clear All",
    saveNoteDefault: "Autosaved on this device",
    saveNoteSaved: "Saved ✓",
    deleteRow: "Delete student",
    confirmClear: "Clear all data for this class? This cannot be undone.",
    rates: { "": "—", EXCELLENT:"Excellent", GOOD:"Good", AVERAGE:"Average", WEAK:"Weak" }
  }
};

let lang = localStorage.getItem(LANG_KEY) || "ar";

let state = {
  classField: "",
  subjectField: "",
  dateField: "",
  students: []
};

function newStudent(){
  return { name:"", homework:"", classwork:"", participation:"", behavior:"", understanding:"", support:"", notes:"" };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){}
  if(!state.students || state.students.length === 0){
    state.students = [newStudent()];
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const note = document.getElementById('saveNote');
  const t = I18N[lang];
  note.textContent = t.saveNoteSaved;
  clearTimeout(saveState._t);
  saveState._t = setTimeout(()=>{ note.textContent = t.saveNoteDefault; }, 1200);
}

function applyLanguage(){
  const t = I18N[lang];
  const html = document.getElementById('htmlRoot');
  html.setAttribute('lang', lang);
  html.setAttribute('dir', t.dir);
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('titleText').textContent = t.title;
  document.getElementById('lblClass').textContent = t.lblClass;
  document.getElementById('lblSubject').textContent = t.lblSubject;
  document.getElementById('lblDate').textContent = t.lblDate;
  document.getElementById('classField').placeholder = t.classPh;
  document.getElementById('subjectField').placeholder = t.subjectPh;
  document.getElementById('addStudentBtn').textContent = t.addStudent;
  document.getElementById('addStudentBtn2').textContent = t.addStudent2;
  document.getElementById('exportCsvBtn').textContent = t.exportCsv;
  document.getElementById('printBtn').textContent = t.print;
  document.getElementById('clearBtn').textContent = t.clearAll;
  document.getElementById('saveNote').textContent = t.saveNoteDefault;

  document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');

  renderHead();
  renderBody();
}

function renderHead(){
  const t = I18N[lang];
  const headRow = document.getElementById('headRow');
  const cols = [t.colNum, t.colName, t.colHomework, t.colClasswork, t.colParticipation, t.colBehavior, t.colUnderstanding, t.colSupport, t.colNotes, ""];
  headRow.innerHTML = "";
  cols.forEach(c => {
    const th = document.createElement('th');
    th.textContent = c;
    headRow.appendChild(th);
  });
}

function renderBody(){
  const t = I18N[lang];
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = "";

  state.students.forEach((s, i) => {
    const tr = document.createElement('tr');

    const tdNum = document.createElement('td');
    tdNum.className = "cell-num";
    tdNum.textContent = i + 1;
    tr.appendChild(tdNum);

    const tdName = document.createElement('td');
    tdName.className = "name-cell";
    const nameInput = document.createElement('input');
    nameInput.type = "text";
    nameInput.placeholder = t.namePh;
    nameInput.value = s.name;
    nameInput.addEventListener('input', e => { s.name = e.target.value; saveState(); });
    tdName.appendChild(nameInput);
    tr.appendChild(tdName);

    RATE_COLS.forEach(col => {
      const td = document.createElement('td');
      const sel = document.createElement('select');
      sel.className = "rate";
      sel.setAttribute('data-val', s[col] || "");
      RATE_KEYS.forEach(key => {
        const o = document.createElement('option');
        o.value = key;
        o.textContent = t.rates[key];
        if(s[col] === key) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener('change', e => {
        s[col] = e.target.value;
        sel.setAttribute('data-val', e.target.value);
        saveState();
      });
      td.appendChild(sel);
      tr.appendChild(td);
    });

    const tdNotes = document.createElement('td');
    tdNotes.className = "notes-cell";
    const notesInput = document.createElement('input');
    notesInput.type = "text";
    notesInput.placeholder = t.notesPh;
    notesInput.value = s.notes;
    notesInput.addEventListener('input', e => { s.notes = e.target.value; saveState(); });
    tdNotes.appendChild(notesInput);
    tr.appendChild(tdNotes);

    const tdAction = document.createElement('td');
    tdAction.className = "row-actions";
    const delBtn = document.createElement('button');
    delBtn.className = "del-row";
    delBtn.title = t.deleteRow;
    delBtn.textContent = "✕";
    delBtn.addEventListener('click', () => {
      state.students.splice(i, 1);
      if(state.students.length === 0) state.students.push(newStudent());
      saveState();
      renderBody();
    });
    tdAction.appendChild(delBtn);
    tr.appendChild(tdAction);

    tbody.appendChild(tr);
  });
}

function addStudent(){
  state.students.push(newStudent());
  saveState();
  renderBody();
  const inputs = document.querySelectorAll('.name-cell input');
  if(inputs.length) inputs[inputs.length - 1].focus();
}

function exportCsv(){
  const t = I18N[lang];
  const headers = [t.colNum, t.colName, t.colHomework, t.colClasswork, t.colParticipation, t.colBehavior, t.colUnderstanding, t.colSupport, t.colNotes];
  const rows = state.students.map((s,i) => [
    i+1, s.name,
    t.rates[s.homework]||"", t.rates[s.classwork]||"", t.rates[s.participation]||"",
    t.rates[s.behavior]||"", t.rates[s.understanding]||"", t.rates[s.support]||"",
    s.notes
  ]);
  let csv = "\uFEFF" + headers.join(",") + "\n";
  rows.forEach(r => {
    csv += r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const cls = state.classField ? state.classField.replace(/\s+/g,'_') : "class";
  const dt = state.dateField || new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `followup_${cls}_${dt}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function setLang(newLang){
  lang = newLang;
  localStorage.setItem(LANG_KEY, lang);
  applyLanguage();
}

document.getElementById('classField').addEventListener('input', e => { state.classField = e.target.value; saveState(); });
document.getElementById('subjectField').addEventListener('input', e => { state.subjectField = e.target.value; saveState(); });
document.getElementById('dateField').addEventListener('input', e => { state.dateField = e.target.value; saveState(); });

document.getElementById('addStudentBtn').addEventListener('click', addStudent);
document.getElementById('addStudentBtn2').addEventListener('click', addStudent);
document.getElementById('exportCsvBtn').addEventListener('click', exportCsv);
document.getElementById('printBtn').addEventListener('click', () => window.print());
document.getElementById('clearBtn').addEventListener('click', () => {
  const t = I18N[lang];
  if(confirm(t.confirmClear)){
    state.students = [newStudent()];
    state.classField = "";
    state.subjectField = "";
    state.dateField = "";
    saveState();
    renderBody();
  }
});

document.getElementById('btnAr').addEventListener('click', () => setLang('ar'));
document.getElementById('btnEn').addEventListener('click', () => setLang('en'));

loadState();
applyLanguage();
document.getElementById('classField').value = state.classField || "";
document.getElementById('subjectField').value = state.subjectField || "";
document.getElementById('dateField').value = state.dateField || "";
</script>
</body>
</html>
