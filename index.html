<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title id="pageTitle">سجل متابعة الطلاب</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e3a5f">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Follow-up">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1e3a5f;
    --navy-dark:#152a45;
    --bg:#eef1f6;
    --surface:#ffffff;
    --line:#e1e6ed;
    --ink:#1c2733;
    --muted:#7c8a9a;
    --accent:#2f6f5e;
    --excellent:#2e8b62;
    --excellent-bg:#e4f5ec;
    --good:#2f6f9f;
    --good-bg:#e6f0f9;
    --average:#c9891f;
    --average-bg:#fbf0dc;
    --weak:#c1483f;
    --weak-bg:#faeae8;
    --radius-card:16px;
    --radius-chip:10px;
    --safe-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Tajawal', 'Inter', sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  html[dir="ltr"] body{ font-family:'Inter', 'Tajawal', sans-serif; }
  button, input, select{ font-family:inherit; }

  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- App bar ---------- */
  .appbar{
    position:sticky;
    top:0;
    z-index:20;
    background:var(--navy);
    color:#fff;
    padding:14px 14px 10px;
    box-shadow:0 2px 8px rgba(21,42,69,.25);
  }
  .appbar-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .appbar-title{ flex:1; min-width:0; }
  .appbar-title h1{
    margin:0;
    font-size:18px;
    font-weight:900;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .appbar-sub{
    margin:2px 0 0;
    font-size:12px;
    color:#c3d0e0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:17px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .icon-btn:active{background:rgba(255,255,255,.28);}
  .lang-pill{
    display:flex;
    border-radius:20px;
    background:rgba(255,255,255,.14);
    overflow:hidden;
    flex-shrink:0;
  }
  .lang-pill button{
    border:none;
    background:transparent;
    color:#dbe6f2;
    font-size:12.5px;
    font-weight:700;
    padding:8px 12px;
    cursor:pointer;
  }
  .lang-pill button.active{
    background:#fff;
    color:var(--navy);
    border-radius:20px;
  }

  /* ---------- Class tabs ---------- */
  .class-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px 14px 2px;
    scrollbar-width:none;
  }
  .class-tabs::-webkit-scrollbar{ display:none; }
  .class-chip{
    flex-shrink:0;
    border:1.5px solid rgba(255,255,255,.35);
    background:transparent;
    color:#dbe6f2;
    font-size:13px;
    font-weight:700;
    padding:7px 14px;
    border-radius:20px;
    cursor:pointer;
    white-space:nowrap;
  }
  .class-chip.active{
    background:#fff;
    color:var(--navy);
    border-color:#fff;
  }
  .class-chip-add{
    flex-shrink:0;
    border:1.5px dashed rgba(255,255,255,.5);
    background:transparent;
    color:#dbe6f2;
    font-size:15px;
    font-weight:900;
    width:34px;
    height:32px;
    border-radius:20px;
    cursor:pointer;
  }

  /* ---------- Date nav ---------- */
  .date-nav{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 14px 0;
  }
  .date-nav button.nav-arrow{
    width:32px;
    height:32px;
    border-radius:50%;
    border:1.5px solid var(--line);
    background:var(--surface);
    color:var(--navy);
    font-size:16px;
    font-weight:900;
    cursor:pointer;
    flex-shrink:0;
  }
  .date-nav input[type="date"]{
    flex:1;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:10px;
    padding:8px 10px;
    font-size:13.5px;
    font-weight:700;
    color:var(--ink);
    text-align:center;
  }
  .date-nav input[type="date"]:focus{ outline:none; border-color:var(--navy); }
  .today-btn{
    flex-shrink:0;
    border:1.5px solid var(--navy);
    background:var(--surface);
    color:var(--navy);
    font-size:12.5px;
    font-weight:800;
    padding:0 12px;
    height:32px;
    border-radius:10px;
    cursor:pointer;
  }

  /* ---------- Search / count row ---------- */
  .subbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px 0;
  }
  .subbar-count{ padding:8px 14px 4px; }
  .count-badge{ font-size:12.5px; font-weight:700; color:var(--muted); }

  .search-wrap{ flex:1; position:relative; display:flex; align-items:center; }
  .search-icon{
    position:absolute;
    inset-inline-start:12px;
    color:var(--muted);
    font-size:16px;
    pointer-events:none;
  }
  .search-input{
    width:100%;
    border:1.5px solid var(--line);
    background:var(--surface);
    border-radius:12px;
    padding:10px 38px;
    font-size:14px;
    color:var(--ink);
  }
  .search-input:focus{ outline:none; border-color:var(--navy); }
  .search-clear{
    position:absolute;
    inset-inline-end:8px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:var(--line);
    color:var(--muted);
    font-size:12px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* ---------- Content ---------- */
  .content{ flex:1; padding:8px 14px calc(96px + var(--safe-bottom)); }

  .empty-state{ text-align:center; padding:60px 20px; color:var(--muted); }
  .empty-state .emoji{font-size:40px; margin-bottom:10px;}
  .empty-state p{margin:0; font-size:14.5px; line-height:1.6;}
  .empty-state button.cta{
    margin-top:14px;
    background:var(--navy);
    color:#fff;
    border:none;
    border-radius:10px;
    padding:10px 20px;
    font-size:13.5px;
    font-weight:700;
    cursor:pointer;
  }

  .no-results{ text-align:center; padding:50px 20px; color:var(--muted); font-size:14px; }

  /* ---------- Student card ---------- */
  .card{
    background:var(--surface);
    border-radius:var(--radius-card);
    box-shadow:0 1px 2px rgba(21,42,69,.06), 0 1px 8px rgba(21,42,69,.05);
    margin-bottom:12px;
    overflow:hidden;
  }
  .card-head{ display:flex; align-items:center; gap:10px; padding:12px 12px 8px; }
  .avatar{
    width:36px; height:36px; border-radius:50%;
    background:var(--navy); color:#fff; font-weight:900; font-size:15px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .card-head input.name-input{
    flex:1; min-width:0; border:none; background:transparent;
    font-size:16px; font-weight:700; color:var(--ink);
    padding:8px 4px; border-bottom:1.5px solid transparent;
  }
  .card-head input.name-input:focus{ outline:none; border-bottom-color:var(--navy); }
  .card-menu-btn{
    width:32px; height:32px; border-radius:50%; border:none;
    background:transparent; color:var(--muted); font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .card-menu-btn:active{background:var(--bg);}

  .rating-grid{ padding:2px 12px 10px; display:flex; flex-direction:column; gap:7px; }
  .rating-row{ display:flex; align-items:center; gap:8px; }
  .rating-label{ width:78px; flex-shrink:0; font-size:12.5px; color:var(--muted); font-weight:700; }
  .rating-options{ flex:1; display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; }
  .chip{
    border:1.5px solid var(--line); background:var(--surface); color:var(--muted);
    font-size:11.5px; font-weight:700; border-radius:var(--radius-chip);
    padding:7px 2px; text-align:center; cursor:pointer; line-height:1.2;
  }
  .chip.sel-excellent{ background:var(--excellent-bg); border-color:var(--excellent); color:var(--excellent); }
  .chip.sel-good{ background:var(--good-bg); border-color:var(--good); color:var(--good); }
  .chip.sel-average{ background:var(--average-bg); border-color:var(--average); color:var(--average); }
  .chip.sel-weak{ background:var(--weak-bg); border-color:var(--weak); color:var(--weak); }

  .notes-wrap{ padding:0 12px 12px; }
  .notes-wrap input{
    width:100%; border:none; background:var(--bg); border-radius:10px;
    padding:10px 12px; font-size:13.5px; color:var(--ink);
  }
  .notes-wrap input:focus{outline:1.5px solid var(--navy);}

  .unsaved-bar{
    display:none; align-items:center; justify-content:space-between; gap:10px;
    margin:0 12px 12px; padding:9px 12px;
    background:var(--average-bg); border:1.5px solid var(--average); border-radius:10px;
  }
  .unsaved-bar.show{ display:flex; }
  .unsaved-text{ font-size:12px; font-weight:700; color:var(--average); }
  .save-btn{
    background:var(--average); color:#fff; border:none; border-radius:8px;
    padding:7px 16px; font-size:12.5px; font-weight:800; cursor:pointer; flex-shrink:0;
  }
  .save-btn:active{ filter:brightness(0.92); }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;
    bottom:calc(24px + var(--safe-bottom));
    inset-inline-end:calc(50% - 280px + 20px);
    width:58px; height:58px; border-radius:50%;
    background:var(--accent); color:#fff; border:none; font-size:26px;
    box-shadow:0 4px 14px rgba(47,111,94,.45);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:15;
  }
  .fab:active{ filter:brightness(0.92); }
  @media (max-width:600px){ .fab{ inset-inline-end:20px; } }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed; bottom:calc(24px + var(--safe-bottom)); left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--navy-dark); color:#fff; font-size:13px; font-weight:700;
    padding:10px 18px; border-radius:30px; opacity:0;
    transition:opacity .2s ease, transform .2s ease; z-index:40; pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Bottom sheet ---------- */
  .sheet-overlay{ position:fixed; inset:0; background:rgba(20,30,45,.45); z-index:50; display:none; }
  .sheet-overlay.open{ display:block; }
  .bottom-sheet{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%) translateY(100%);
    width:100%; max-width:560px; background:var(--surface); border-radius:20px 20px 0 0;
    z-index:51; transition:transform .25s ease; max-height:88vh; overflow-y:auto;
    padding-bottom:calc(20px + var(--safe-bottom));
  }
  .bottom-sheet.open{ transform:translateX(-50%) translateY(0); }
  .sheet-handle{ width:38px; height:4px; background:var(--line); border-radius:4px; margin:10px auto 4px; }
  .sheet-title{ font-size:16px; font-weight:900; color:var(--navy); padding:10px 20px 4px; }
  .sheet-field{ padding:10px 20px; }
  .sheet-field label{ display:block; font-size:12.5px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  .sheet-field input{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px 12px;
    font-size:14.5px; color:var(--ink); background:var(--bg);
  }
  .sheet-field input:focus{ outline:none; border-color:var(--navy); }
  .sheet-divider{ height:1px; background:var(--line); margin:10px 20px; }
  .sheet-action{
    display:flex; align-items:center; gap:12px; width:100%; border:none; background:none;
    padding:14px 20px; font-size:14.5px; font-weight:700; color:var(--ink); text-align:start; cursor:pointer;
  }
  .sheet-action:active{ background:var(--bg); }
  .sheet-action.danger{ color:var(--weak); }
  .sheet-action .sa-icon{ width:22px; text-align:center; font-size:16px; flex-shrink:0; }

  .manage-class-row{
    display:flex; align-items:center; gap:10px; padding:10px 20px;
  }
  .manage-class-row .mc-name{
    flex:1; font-size:14px; font-weight:700; color:var(--ink);
  }
  .manage-class-row button{
    border:none; background:var(--bg); color:var(--muted);
    width:30px; height:30px; border-radius:50%; font-size:13px; cursor:pointer; flex-shrink:0;
  }
  .manage-class-row button.mc-delete{ color:var(--weak); }

  @media (max-width:380px){
    .rating-label{ width:64px; font-size:11.5px; }
    .chip{ font-size:10.5px; padding:6px 2px; }
  }

  @media print{
    .appbar, .fab, .toast, .sheet-overlay, .bottom-sheet, .card-menu-btn, .class-tabs, .date-nav, .subbar{ display:none !important; }
    body{ background:#fff; }
  }
</style>
</head>
<body>

<div class="app">

  <div class="appbar">
    <div class="appbar-row">
      <div class="appbar-title">
        <h1 id="titleText">سجل متابعة الطلاب</h1>
        <p class="appbar-sub" id="appbarSub">—</p>
      </div>
      <div class="lang-pill">
        <button id="btnAr" class="active">AR</button>
        <button id="btnEn">EN</button>
      </div>
      <button class="icon-btn" id="menuBtn" title="Menu">⋮</button>
    </div>
  </div>

  <div class="class-tabs" id="classTabs"></div>

  <div class="date-nav">
    <button class="nav-arrow" id="datePrev">‹</button>
    <input type="date" id="dateInput">
    <button class="nav-arrow" id="dateNext">›</button>
    <button class="today-btn" id="todayBtn"></button>
  </div>

  <div class="subbar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="searchInput" class="search-input">
      <button class="search-clear" id="searchClear" style="display:none;">✕</button>
    </div>
  </div>
  <div class="subbar subbar-count">
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div class="content" id="content"></div>

  <button class="fab" id="fabAdd" title="">+</button>
  <div class="toast" id="toast"></div>

  <div class="sheet-overlay" id="sheetOverlay"></div>
  <div class="bottom-sheet" id="bottomSheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="sheetTitle">إعدادات</div>

    <div class="sheet-field">
      <label id="lblSubject">المادة (للفصل الحالي)</label>
      <input type="text" id="subjectField">
    </div>

    <div class="sheet-divider"></div>
    <div class="sheet-title" id="manageClassesTitle" style="font-size:14px;">إدارة الفصول</div>
    <div id="manageClassesList"></div>

    <div class="sheet-divider"></div>

    <button class="sheet-action" id="exportCsvBtn"><span class="sa-icon">⭳</span><span id="actExportLabel"></span></button>
    <button class="sheet-action" id="printBtn"><span class="sa-icon">⎙</span><span id="actPrintLabel"></span></button>
    <button class="sheet-action danger" id="clearDayBtn"><span class="sa-icon">✕</span><span id="actClearDayLabel"></span></button>
  </div>

</div>

<script>
const RATE_KEYS = ["EXCELLENT", "GOOD", "AVERAGE", "WEAK"];
const RATE_CLASS = { EXCELLENT:"sel-excellent", GOOD:"sel-good", AVERAGE:"sel-average", WEAK:"sel-weak" };
const FIELDS = ["homework","classwork","participation","behavior","understanding","support"];
const STORAGE_KEY = "student_followup_sheet_v3";

const LANG_KEY = "student_followup_lang";

const I18N = {

  },
  en: {

    title: "Follow-up Sheet",
    subtitleWith: (c,s) => [c,s].filter(Boolean).join(" · ") || "No details set",

let lang = localStorage.getItem(LANG_KEY) || "ar";
let searchQuery = "";

function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0');
}
function shiftDate(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,'0') + "-" + String(dt.getDate()).padStart(2,'0');
}

let state = {
  classes: [],
  currentClassId: null,
  currentDate: todayStr()
};

function blankDayFields(){
  return { homework:"", classwork:"", participation:"", behavior:"", understanding:"", support:"", notes:"", _dirty:false };
}

function migrateFromV2(){
  try{
    const raw = localStorage.getItem(OLD_STORAGE_KEY);
    if(!raw) return false;
    const old = JSON.parse(raw);
    if(!old || !old.students || old.students.length === 0) return false;
    const t = I18N[lang];
    const clsId = uid();
    const dateStr = old.dateField || todayStr();
    const students = old.students.map(s => ({ id: uid(), name: s.name || "" }));
    const dayRecord = {};
    old.students.forEach((s, i) => {
      dayRecord[students[i].id] = {
        homework: s.homework || "", classwork: s.classwork || "", participation: s.participation || "",
        behavior: s.behavior || "", understanding: s.understanding || "", support: s.support || "",
        notes: s.notes || ""
      };
    });
    const cls = {
      id: clsId,
      name: old.classField || t.defaultClassName,
      subject: old.subjectField || "",
      students: students,
      days: { [dateStr]: dayRecord }
    };
    state.classes = [cls];
    state.currentClassId = clsId;
    state.currentDate = dateStr;
    return true;
  }catch(e){ return false; }
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.classes) state = parsed;
    } else {
      migrateFromV2();
    }
  }catch(e){}

  if(!state.classes) state.classes = [];
  state.classes.forEach(c => {
    if(!c.students) c.students = [];
    if(!c.days) c.days = {};
    c.students.forEach(s => { s._dirty = false; });
  });
  if(!state.currentDate) state.currentDate = todayStr();
  if(!state.currentClassId && state.classes.length){
    state.currentClassId = state.classes[0].id;
  }
}

function persist(){
  const cleanClasses = state.classes.map(c => {
    const cleanStudents = c.students.map(s => {
      const copy = Object.assign({}, s);
      delete copy._dirty;
      return copy;
    });
    const cleanDays = {};
    Object.keys(c.days || {}).forEach(dateStr => {
      const dayObj = c.days[dateStr];
      const cleanDay = {};
      Object.keys(dayObj).forEach(sid => {
        const rec = Object.assign({}, dayObj[sid]);
        delete rec._dirty;
        cleanDay[sid] = rec;
      });
      cleanDays[dateStr] = cleanDay;
    });
    return { id: c.id, name: c.name, subject: c.subject || "", students: cleanStudents, days: cleanDays };
  });
  const toSave = { classes: cleanClasses, currentClassId: state.currentClassId, currentDate: state.currentDate };
  localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
}

let toastTimer = null;
function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 1400);
}

function initials(name){
  const trimmed = (name || "").trim();
  if(!trimmed) return "?";
  return trimmed.charAt(0).toUpperCase();
}

function getCurrentClass(){
  return state.classes.find(c => c.id === state.currentClassId) || null;
}

function ensureStudentDay(cls, dateStr, studentId){
  if(!cls.days) cls.days = {};
  if(!cls.days[dateStr]) cls.days[dateStr] = {};
  if(!cls.days[dateStr][studentId]) cls.days[dateStr][studentId] = blankDayFields();
  return cls.days[dateStr][studentId];
}

function matchesSearch(s){
  if(!searchQuery) return true;
  return (s.name || "").toLowerCase().includes(searchQuery);
}

function ratingRowsConfig(t){
  return [
    ["homework", t.colHomework],
    ["classwork", t.colClasswork],
    ["participation", t.colParticipation],
    ["behavior", t.colBehavior],
    ["understanding", t.colUnderstanding],
    ["support", t.colSupport]
  ];
}

/* ---------------- Class tabs ---------------- */
function renderClassTabs(){
  const t = I18N[lang];
  const wrap = document.getElementById('classTabs');
  wrap.innerHTML = "";
  state.classes.forEach(c => {
    const chip = document.createElement('button');
    chip.className = "class-chip" + (c.id === state.currentClassId ? " active" : "");
    chip.textContent = c.name || "?";
    chip.addEventListener('click', () => {
      if(state.currentClassId !== c.id){
        state.currentClassId = c.id;
        searchQuery = "";
        document.getElementById('searchInput').value = "";
        document.getElementById('searchClear').style.display = 'none';
        persist();
        renderAll();
      }
    });
    wrap.appendChild(chip);
  });
  const addChip = document.createElement('button');
  addChip.className = "class-chip-add";
  addChip.textContent = "+";
  addChip.addEventListener('click', addClass);
  wrap.appendChild(addChip);
}

function addClass(){
  const t = I18N[lang];
  const name = prompt(t.newClassPrompt, "");
  if(name === null) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  const cls = { id: uid(), name: trimmed, subject: "", students: [], days: {} };
  state.classes.push(cls);
  state.currentClassId = cls.id;
  persist();
  renderAll();
  showToast(t.toastClassAdded);
}

/* ---------------- Date nav ---------------- */
function renderDateNav(){
  const t = I18N[lang];
  document.getElementById('dateInput').value = state.currentDate;
  document.getElementById('todayBtn').textContent = t.todayBtnLabel;
}

/* ---------------- Meta / subtitle / count ---------------- */
function renderMeta(){
  const t = I18N[lang];
  const cls = getCurrentClass();
  document.getElementById('appbarSub').textContent = t.subtitleWith(cls ? cls.name : "", cls ? cls.subject : "");
  document.getElementById('subjectField').value = cls ? (cls.subject || "") : "";
  const visibleCount = cls ? cls.students.filter(matchesSearch).length : 0;
  document.getElementById('countBadge').textContent = t.countLabel(visibleCount);
}

/* ---------------- Manage classes list (in sheet) ---------------- */
function renderManageClasses(){
  const t = I18N[lang];
  const list = document.getElementById('manageClassesList');
  list.innerHTML = "";
  state.classes.forEach(c => {
    const row = document.createElement('div');
    row.className = "manage-class-row";

    const nameSpan = document.createElement('div');
    nameSpan.className = "mc-name";
    nameSpan.textContent = c.name;
    row.appendChild(nameSpan);

    const renameBtn = document.createElement('button');
    renameBtn.textContent = "✎";
    renameBtn.addEventListener('click', () => {
      const newName = prompt(t.renameClassPrompt, c.name);
      if(newName === null) return;
      const trimmed = newName.trim();
      if(!trimmed) return;
      c.name = trimmed;
      persist();
      renderAll();
    });
    row.appendChild(renameBtn);

    const delBtn = document.createElement('button');
    delBtn.className = "mc-delete";
    delBtn.textContent = "✕";
    delBtn.addEventListener('click', () => {
      if(confirm(t.confirmDeleteClass)){
        const idx = state.classes.findIndex(x => x.id === c.id);
        if(idx >= 0) state.classes.splice(idx, 1);
        if(state.currentClassId === c.id){
          state.currentClassId = state.classes.length ? state.classes[0].id : null;
        }
        persist();
        renderAll();
      }
    });
    row.appendChild(delBtn);

    list.appendChild(row);
  });
}

/* ---------------- Cards ---------------- */
function renderCards(){
  const t = I18N[lang];
  const content = document.getElementById('content');
  content.innerHTML = "";

  const cls = getCurrentClass();

  if(!cls){
    const empty = document.createElement('div');
    empty.className = "empty-state";
    empty.innerHTML = "<div class=\"emoji\">🏫</div><p><strong>" + t.emptyTitleNoClass + "</strong><br>" + t.emptyHintNoClass + "</p>";
    const btn = document.createElement('button');
    btn.className = "cta";
    btn.textContent = t.addFirstClassBtn;
    btn.addEventListener('click', addClass);
    empty.appendChild(btn);
    content.appendChild(empty);
    renderMeta();
    return;
  }

  if(cls.students.length === 0){
    const empty = document.createElement('div');
    empty.className = "empty-state";
    empty.innerHTML = "<div class=\"emoji\">📋</div><p><strong>" + t.emptyTitle + "</strong><br>" + t.emptyHint + "</p>";
    content.appendChild(empty);
    renderMeta();
    return;
  }

  const visible = cls.students
    .map((s, idx) => ({ s, idx }))
    .filter(({ s }) => matchesSearch(s));

  if(visible.length === 0){
    const noRes = document.createElement('div');
    noRes.className = "no-results";
    noRes.innerHTML = "<strong>" + t.noResultsTitle + "</strong><br>" + t.noResultsHint;
    content.appendChild(noRes);
    renderMeta();
    return;
  }

  visible.forEach(({ s, idx }) => {
    const dayRec = ensureStudentDay(cls, state.currentDate, s.id);

    const card = document.createElement('div');
    card.className = "card";

    const head = document.createElement('div');
    head.className = "card-head";

    const avatar = document.createElement('div');
    avatar.className = "avatar";
    avatar.textContent = initials(s.name);
    head.appendChild(avatar);

    const nameInput = document.createElement('input');
    nameInput.className = "name-input";
    nameInput.type = "text";
    nameInput.placeholder = t.namePh;
    nameInput.value = s.name;
    head.appendChild(nameInput);

    const delBtn = document.createElement('button');
    delBtn.className = "card-menu-btn";
    delBtn.textContent = "✕";
    delBtn.addEventListener('click', () => {
      if(confirm(t.deleteConfirm)){
        cls.students.splice(idx, 1);
        Object.keys(cls.days || {}).forEach(dateStr => {
          delete cls.days[dateStr][s.id];
        });
        persist();
        renderCards();
        showToast(t.toastDeleted);
      }
    });
    head.appendChild(delBtn);

    card.appendChild(head);

    const grid = document.createElement('div');
    grid.className = "rating-grid";
    ratingRowsConfig(t).forEach(([col, label]) => {
      const row = document.createElement('div');
      row.className = "rating-row";

      const lbl = document.createElement('div');
      lbl.className = "rating-label";
      lbl.textContent = label;
      row.appendChild(lbl);

      const opts = document.createElement('div');
      opts.className = "rating-options";
      RATE_KEYS.forEach(key => {
        const chip = document.createElement('button');
        chip.type = "button";
        chip.className = "chip" + (dayRec[col] === key ? " " + RATE_CLASS[key] : "");
        chip.textContent = t.rateShort[key];
        chip.addEventListener('click', () => {
          dayRec[col] = (dayRec[col] === key) ? "" : key;
          dayRec._dirty = true;
          renderCards();
        });
        opts.appendChild(chip);
      });
      row.appendChild(opts);
      grid.appendChild(row);
    });
    card.appendChild(grid);

    const notesWrap = document.createElement('div');
    notesWrap.className = "notes-wrap";
    const notesInput = document.createElement('input');
    notesInput.type = "text";
    notesInput.placeholder = t.notesPh;
    notesInput.value = dayRec.notes;
    notesWrap.appendChild(notesInput);
    card.appendChild(notesWrap);

    const unsavedBar = document.createElement('div');
    unsavedBar.className = "unsaved-bar" + ((s._dirty || dayRec._dirty) ? " show" : "");
    const unsavedLabel = document.createElement('span');
    unsavedLabel.className = "unsaved-text";
    unsavedLabel.textContent = t.unsavedText;
    const saveBtn = document.createElement('button');
    saveBtn.className = "save-btn";
    saveBtn.textContent = t.saveBtn;
    saveBtn.addEventListener('click', () => {
      s._dirty = false;
      dayRec._dirty = false;
      persist();
      unsavedBar.classList.remove('show');
      showToast(t.toastSaved);
    });
    unsavedBar.appendChild(unsavedLabel);
    unsavedBar.appendChild(saveBtn);
    card.appendChild(unsavedBar);

    nameInput.addEventListener('input', e => {
      s.name = e.target.value;
      avatar.textContent = initials(s.name);
      s._dirty = true;
      unsavedBar.classList.add('show');
    });
    notesInput.addEventListener('input', e => {
      dayRec.notes = e.target.value;
      dayRec._dirty = true;
      unsavedBar.classList.add('show');
    });

    content.appendChild(card);
  });

  renderMeta();
}

function renderAll(){
  renderClassTabs();
  renderDateNav();
  renderManageClasses();
  renderCards();
}

function applyLanguage(){
  const t = I18N[lang];
  const html = document.getElementById('htmlRoot');
  html.setAttribute('lang', lang);
  html.setAttribute('dir', t.dir);
  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('titleText').textContent = t.title;
  document.getElementById('sheetTitle').textContent = t.sheetTitle;
  document.getElementById('manageClassesTitle').textContent = t.manageClassesTitle;
  document.getElementById('lblSubject').textContent = t.lblSubject;
  document.getElementById('subjectField').placeholder = t.subjectPh;
  document.getElementById('searchInput').placeholder = "";
  document.getElementById('actExportLabel').textContent = t.exportCsv;
  document.getElementById('actPrintLabel').textContent = t.print;
  document.getElementById('actClearDayLabel').textContent = t.clearDay;
  document.getElementById('fabAdd').title = t.fabTitle;
  document.getElementById('searchInput').placeholder = (lang === 'ar') ? "ابحث بالاسم..." : "Search by name...";

  document.getElementById('btnAr').classList.toggle('active', lang === 'ar');
  document.getElementById('btnEn').classList.toggle('active', lang === 'en');

  renderAll();
}

function addStudent(){
  const t = I18N[lang];
  const cls = getCurrentClass();
  if(!cls){ addClass(); return; }
  cls.students.push({ id: uid(), name: "", _dirty:false });
  persist();
  renderCards();
  showToast(t.toastAdded);
  const inputs = document.querySelectorAll('.name-input');
  if(inputs.length){
    const last = inputs[inputs.length - 1];
    last.focus();
    last.scrollIntoView({behavior:"smooth", block:"center"});
  }
}

function exportCsv(){
  const t = I18N[lang];
  const cls = getCurrentClass();
  if(!cls) return;
  const cols = ratingRowsConfig(t);
  const headers = [t.numHeader, t.nameHeader, ...cols.map(c=>c[1]), t.notesHeader];
  const rows = cls.students.map((s,i) => {
    const rec = (cls.days[state.currentDate] && cls.days[state.currentDate][s.id]) || blankDayFields();
    return [
      i+1, s.name,
      ...cols.map(([col]) => rec[col] ? t.rateShort[rec[col]] : ""),
      rec.notes || ""
    ];
  });
  let csv = "\uFEFF" + headers.join(",") + "\n";
  rows.forEach(r => {
    csv += r.map(v => "\"" + String(v).replace(/"/g,'""') + "\"").join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const clsName = (cls.name || "class").replace(/\s+/g,'_');
  a.href = url;
  a.download = "followup_" + clsName + "_" + state.currentDate + ".csv";
  a.click();
  URL.revokeObjectURL(url);
}

function setLang(newLang){
  lang = newLang;
  localStorage.setItem(LANG_KEY, lang);
  applyLanguage();
}

function openSheet(){
  document.getElementById('sheetOverlay').classList.add('open');
  document.getElementById('bottomSheet').classList.add('open');
}
function closeSheet(){
  document.getElementById('sheetOverlay').classList.remove('open');
  document.getElementById('bottomSheet').classList.remove('open');
}

document.getElementById('subjectField').addEventListener('input', e => {
  const cls = getCurrentClass();
  if(!cls) return;
  cls.subject = e.target.value;
  persist();
  renderMeta();
});

document.getElementById('fabAdd').addEventListener('click', addStudent);
document.getElementById('exportCsvBtn').addEventListener('click', () => { exportCsv(); closeSheet(); });
document.getElementById('printBtn').addEventListener('click', () => { closeSheet(); setTimeout(()=>window.print(), 200); });
document.getElementById('clearDayBtn').addEventListener('click', () => {
  const t = I18N[lang];
  const cls = getCurrentClass();
  if(!cls) return;
  if(confirm(t.confirmClearDay)){
    cls.days[state.currentDate] = {};
    persist();
    renderCards();
    closeSheet();
  }
});
document.getElementById('menuBtn').addEventListener('click', openSheet);
document.getElementById('sheetOverlay').addEventListener('click', closeSheet);

document.getElementById('btnAr').addEventListener('click', () => setLang('ar'));
document.getElementById('btnEn').addEventListener('click', () => setLang('en'));

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  document.getElementById('searchClear').style.display = e.target.value ? 'flex' : 'none';
  renderCards();
});
document.getElementById('searchClear').addEventListener('click', () => {
  const input = document.getElementById('searchInput');
  input.value = "";
  searchQuery = "";
  document.getElementById('searchClear').style.display = 'none';
  renderCards();
  input.focus();
});

document.getElementById('dateInput').addEventListener('change', e => {
  if(e.target.value){
    state.currentDate = e.target.value;
    persist();
    renderDateNav();
    renderCards();
  }
});
document.getElementById('datePrev').addEventListener('click', () => {
  state.currentDate = shiftDate(state.currentDate, -1);
  persist();
  renderDateNav();
  renderCards();
});
document.getElementById('dateNext').addEventListener('click', () => {
  state.currentDate = shiftDate(state.currentDate, 1);
  persist();
  renderDateNav();
  renderCards();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  state.currentDate = todayStr();
  persist();
  renderDateNav();
  renderCards();
});

window.addEventListener('beforeunload', (e) => {
  let hasUnsaved = false;
  state.classes.forEach(c => {
    c.students.forEach(s => { if(s._dirty) hasUnsaved = true; });
    Object.values(c.days || {}).forEach(day => {
      Object.values(day).forEach(rec => { if(rec._dirty) hasUnsaved = true; });
    });
  });
  if(hasUnsaved){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

loadState();
applyLanguage();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
